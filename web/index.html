     HTML + React 18 via CDN, sem bundler/build. Babel standalone permite JSX inline. -->

     Tesseract.js quando Tesseract.recognize() é chamado pela primeira vez. -->

<style>
  /* ---------- E1 / H1.1 — Tokens "Golden Hour" (claro e escuro) ---------- */
  :root {
    --color-primary: #E2673A;        /* terracota/coral */
    --color-primary-contrast: #FFFFFF;
    --color-secondary: #1F5C56;      /* verde-petróleo profundo */
    --color-surface: #FBF4EA;        /* areia/creme */
    --color-surface-raised: #FFFFFF;
    --color-border: #E7D9C6;
    --color-text: #211D1A;           /* quase-preto, não preto puro */
    --color-text-muted: #6B6259;
    --color-danger: #B3413A;
    --color-conflict: #F0B429;
    --radius-md: 12px;
    --radius-lg: 20px;
    --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --tracking-tight: -0.01em;
    --tracking-wide: 0.02em;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-primary: #F0794C;
      --color-primary-contrast: #1A1512;
      --color-secondary: #4FBDAF;
      --color-surface: #171A24;      /* azul-crepúsculo profundo */
      --color-surface-raised: #20242F;
      --color-border: #2E3342;
      --color-text: #F3EFEA;
      --color-text-muted: #A8A296;
      --color-danger: #E2857D;
      --color-conflict: #F0B429;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    background: var(--color-surface);
    color: var(--color-text);
    letter-spacing: var(--tracking-tight);
  }
  h1, h2, h3 { letter-spacing: var(--tracking-tight); }
  small, .label { letter-spacing: var(--tracking-wide); }
  button { font-family: inherit; }

  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .app-shell { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 72px; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--color-surface-raised);
    border-bottom: 1px solid var(--color-border);
    position: sticky; top: 0; z-index: 10;
  }
  .top-bar h1 { font-size: 17px; margin: 0; }
  .icon-btn {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--color-text); padding: 4px 8px; border-radius: var(--radius-md);
  }
  .icon-btn:hover { background: var(--color-border); }

  .screen { flex: 1; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }

  /* ---------- E1 / H1.2 — Componentes base reutilizáveis ---------- */

  /* Card — usado em Home (lista de viagens), Integrantes e Log de auditoria */
  .card {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card p { margin: 0; color: var(--color-text-muted); font-size: 13px; }

  /* Botões */
  .btn {
    border: none; border-radius: var(--radius-md); padding: 12px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--color-primary); color: var(--color-primary-contrast); }
  .btn-secondary { background: transparent; color: var(--color-secondary); border: 1px solid var(--color-secondary); }
  .btn-danger { background: transparent; color: var(--color-danger); border: 1px solid var(--color-danger); }
  .btn-block-row { display: flex; gap: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--color-text-muted); }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border); background: var(--color-surface-raised);
    color: var(--color-text); font-size: 14px; font-family: inherit;
  }
  .hint { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
  .error-text { font-size: 12px; color: var(--color-danger); margin-top: 4px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; letter-spacing: var(--tracking-wide); text-transform: uppercase;
  }
  .badge-admin { background: var(--color-primary); color: var(--color-primary-contrast); }
  .badge-coadmin { background: var(--color-secondary); color: white; }
  .badge-convidado { background: var(--color-border); color: var(--color-text-muted); }

  .empty-state { text-align: center; padding: 40px 16px; color: var(--color-text-muted); }
  .empty-state .btn { max-width: 260px; margin: 12px auto 0; }

  /* Tab bar inferior (mobile-first) — usada em Home / Viagem / Perfil */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--color-surface-raised);
    border-top: 1px solid var(--color-border); z-index: 10;
  }
  .tab-bar button {
    flex: 1; background: none; border: none; padding: 10px 4px 12px;
    font-size: 11px; color: var(--color-text-muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tab-bar button .tab-icon { font-size: 18px; }
  .tab-bar button.active { color: var(--color-primary); font-weight: 700; }

  /* Faixa de abas horizontal (nível 2 da IA, dentro de "Viagem") */
  .segmented-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;
  }
  .segmented-tabs button {
    flex: 0 0 auto; border: 1px solid var(--color-border); background: var(--color-surface-raised);
    color: var(--color-text-muted); border-radius: 999px; padding: 8px 14px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .segmented-tabs button.active {
    background: var(--color-primary); color: var(--color-primary-contrast); border-color: var(--color-primary);
  }

  /* Drawer lateral — Notificações, Configurações, Privacidade, Sair */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 20;
  }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
    background: var(--color-surface-raised); z-index: 21; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 4px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.15);
  }
  .drawer h2 { font-size: 15px; margin: 0 0 12px; }
  .drawer button {
    text-align: left; background: none; border: none; padding: 12px 8px;
    font-size: 14px; color: var(--color-text); border-radius: var(--radius-md); cursor: pointer;
  }
  .drawer button:hover { background: var(--color-border); }

  /* Bottom sheet — usado em Convite/Compartilhar e Promover integrante */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--color-surface-raised); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 20px 28px; z-index: 31;
  }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--color-border); border-radius: 999px;
    margin: 0 auto 16px;
  }

  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .code-display {
    font-family: monospace; font-size: 22px; letter-spacing: 2px; font-weight: 700;
    text-align: center; padding: 12px; background: var(--color-surface);
    border-radius: var(--radius-md); margin: 12px 0;
  }

  .audit-item { font-size: 12px; color: var(--color-text-muted); padding: 6px 0; border-bottom: 1px solid var(--color-border); }
  .audit-item:last-child { border-bottom: none; }

  .banner-error {
    background: var(--color-danger); color: white; padding: 12px 16px;
    border-radius: var(--radius-md); margin-bottom: 12px; font-size: 13px;
  }
</style>
</head>
<body>
<div id="root">
  <!-- Fallback estático: se React não montar (risco documentado em 00-F §11 — arquivo único
       sem bundler pode gerar "tela branca" por erro de sintaxe), isto evita uma tela em branco. -->
  <div style="padding:24px;font-family:system-ui,sans-serif;color:#211D1A;">
    Carregando Trippin…
  </div>
</div>

<script>
  // Mitigação adicional do risco de "tela branca" (00-F §11 / decisão #1): captura erros
  // não tratados do runtime e mostra uma mensagem legível em vez de uma tela vazia.
  window.addEventListener('error', function (event) {
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      root.innerHTML =
        '<div style="padding:24px;font-family:system-ui,sans-serif;">' +
        '<h2 style="color:#B3413A;">Algo deu errado ao carregar o Trippin</h2>' +
        '<p style="color:#6B6259;">Recarregue a página. Se o problema persistir, avise o time.</p>' +
        '</div>';
    }
  });
</script>

// E8 / H8.2 — parser estruturado por padrões conhecidos, sem OCR/LLM em
// servidor (decisão de tecnologia #7, 00-F §10). Cobre os formatos de data
// mais comuns em comprovantes/passagens (numérico e por extenso, pt-BR/en-US)
// e horário 24h. Qualquer coisa fora desses padrões cai no fallback H8.5 —
// os campos ficam vazios, o usuário preenche na tela de confirmação (H8.3).
const MONTHS_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MONTHS_EN = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];

function parseDocumentText(text) {
  const result = { date: null, time: null, title: '' };
  if (!text) return result;

  const numericDate = text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if (numericDate) {
    let [, d, m, y] = numericDate;
    if (y.length === 2) y = '20' + y;
    if (Number(m) <= 12 && Number(d) <= 31) {
      result.date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
    }
  }
  if (!result.date) {
    const monthsPattern = MONTHS_PT.concat(MONTHS_EN).join('|');
    const wordDate = text.toLowerCase().match(new RegExp(`\\b(\\d{1,2})\\s*(?:de\\s*)?(${monthsPattern})\\s*(?:de\\s*)?(\\d{4})\\b`));
    if (wordDate) {
      const [, d, monthName, y] = wordDate;
      let mi = MONTHS_PT.indexOf(monthName);
      if (mi === -1) mi = MONTHS_EN.indexOf(monthName);
      if (mi !== -1) result.date = `${y}-${String(mi + 1).padStart(2, '0')}-${d.padStart(2, '0')}`;
    }
  }

  const timeMatch = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (timeMatch) result.time = `${timeMatch[1].padStart(2, '0')}:${timeMatch[2]}`;

  // Título: sem OCR/LLM não há como "entender" o documento — heurística
  // simples, primeira linha substancial (layout típico de recibo/passagem).
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length >= 4 && !/^\d+$/.test(l));
  if (lines.length > 0) result.title = lines[0].slice(0, 80);

  return result;
}

// OCR no cliente (Tesseract.js). PDFs e outros formatos não-imagem caem
// direto no fallback H8.5 — OCR de PDF exigiria renderizar páginas antes
// (ex.: pdf.js), fora do escopo desta versão; o upload em si (H8.1) continua
// funcionando normalmente para qualquer tipo de arquivo.
async function extractFromDocument(file) {
  try {
    if (!file.type || !file.type.startsWith('image/')) {
      return { date: null, time: null, title: '' };
    }
    const { data } = await Tesseract.recognize(file, 'por+eng');
    return parseDocumentText(data.text);
  } catch (error) {
    logClientError(error, { source: 'extractFromDocument' });
    return { date: null, time: null, title: '' };
  }
}

/* =========================================================================

   trip/dia/faixa) + fila de operações pendentes de escrita, ambas em
   localStorage (decisão de tecnologia #5, 00-F §10). Escopo deliberadamente

   indo para o Storage, que exige rede de qualquer forma; só cronograma e
   despesas (payload JSON pequeno) entram na fila. Edições/criações offline
   aparecem otimisticamente na visão Dia do Cronograma (onde o formulário
   opera); Semana/Mês só refletem o estado depois da próxima sincronização —
   não são repovoadas otimisticamente, para não complicar o código de reordenar
   por múltiplas chaves de cache simultâneas.
   ========================================================================= */
const CACHE_PREFIX = 'trippin_cache::';
const QUEUE_PREFIX = 'trippin_queue::';

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(data)); } catch (e) { /* quota/modo privado: segue sem cache, nunca quebra o app */ }
}
function cacheKeysWithPrefix(prefix) {
  const full = CACHE_PREFIX + prefix;
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(full)) keys.push(k.slice(CACHE_PREFIX.length));
  }
  return keys;
}

function queueGet(tripId) {
  try { return JSON.parse(localStorage.getItem(QUEUE_PREFIX + tripId) || '[]'); } catch (e) { return []; }
}
function queueSet(tripId, list) {
  try { localStorage.setItem(QUEUE_PREFIX + tripId, JSON.stringify(list)); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent('trippin:queue-changed', { detail: { tripId } })); } catch (e) {}
}
function queuePush(tripId, item) {
  const list = queueGet(tripId);
  list.push(item);
  queueSet(tripId, list);
}
function queuePendingCount(tripId) {

}

// Erro de conectividade (offline, DNS, timeout) — diferente de um erro de
// negócio (RLS, validação) que o Supabase também devolve como "erro".
// navigator.onLine sozinho não é confiável (falso-positivo em rede cativa),
// por isso os dois sinais são checados.
function isConnectivityError(error) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  if (error instanceof TypeError) return true;
  const msg = String((error && error.message) || error || '').toLowerCase();
  return msg.includes('failed to fetch') || msg.includes('network') || msg.includes('load failed');
}

function localPendingId() {
  return 'local_' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
}

// H12.1 — leitura com cache: tenta a rede primeiro (dado sempre fresco
// quando há conexão); só cai no cache salvo se a chamada falhar por
// conectividade. Um erro de negócio (RLS, 4xx) nunca usa o cache — sobe
// normalmente, como antes.
async function cachedRead(key, fetchFn) {
  try {
    const data = await fetchFn();
    cacheSet(key, data);
    return data;
  } catch (error) {
    if (isConnectivityError(error)) {
      const cached = cacheGet(key);
      if (cached !== null) return cached;
    }
    throw error;
  }
}

// Localiza um evento em qualquer cache de dia/faixa já carregado (não sabemos
// de antemão em qual dia ele está) e aplica uma mutação — usado por
// updateEvent/deleteEvent offline para atualizar a UI otimisticamente.
// mutator(event) retorna o evento atualizado, ou null para removê-lo.
function mutateCachedEvents(eventId, mutator) {
  let foundTripId = null;
  const keys = cacheKeysWithPrefix('events_day_').concat(cacheKeysWithPrefix('events_range_'));
  keys.forEach(key => {
    const arr = cacheGet(key);
    if (!Array.isArray(arr)) return;
    const idx = arr.findIndex(e => e.id === eventId);
    if (idx === -1) return;
    foundTripId = arr[idx].tripId;
    const result = mutator(arr[idx]);
    const newArr = arr.slice();
    if (result === null) newArr.splice(idx, 1); else newArr[idx] = result;
    cacheSet(key, newArr);
  });
  return foundTripId;
}
function addCachedEvent(tripId, dayIso, event) {
  const key = `events_day_${tripId}_${dayIso}`;
  const arr = cacheGet(key) || [];
  cacheSet(key, arr.concat([event]));
}

// H12.3 — reaplica um item da fila ao reconectar. Update/delete usam
// last-write-wins comparando o timestamp local de quando a ação foi feita
// offline contra schedule_events.updated_at no servidor: se o servidor tem
// uma edição mais recente, a ação offline é descartada (registrada no
// histórico de auditoria dos dois lados, nunca escondida).
async function applyQueuedItem(item, tripId, userId) {
  if (item.entity === 'event') {
    if (item.op === 'create') {
      await RawTrippinAPI.createEvent(item.payload);
      return;
    }
    const { data: current } = await supabaseClient.from('schedule_events').select('updated_at').eq('id', item.entityId).maybeSingle();
    if (!current) return; // já foi excluído no servidor — nada a reconciliar
    const serverIsNewer = new Date(current.updated_at).getTime() > item.clientTimestamp;
    if (item.op === 'update') {
      if (serverIsNewer) {
        await RawTrippinAPI.addAuditEntry(tripId, userId, 'uma edição de evento feita offline foi descartada (o servidor tinha uma versão mais recente)');
        return;
      }
      await RawTrippinAPI.updateEvent(item.entityId, item.payload.patch, item.payload.participantIds);
      await RawTrippinAPI.addAuditEntry(tripId, userId, 'sincronizou uma edição de evento feita offline');
    } else if (item.op === 'delete') {
      if (serverIsNewer) {
        await RawTrippinAPI.addAuditEntry(tripId, userId, 'uma exclusão de evento feita offline foi descartada (o servidor tinha uma versão mais recente)');
        return;
      }
      await RawTrippinAPI.deleteEvent(item.entityId);
    }
  } else if (item.entity === 'expense' && item.op === 'create') {
    await RawTrippinAPI.createExpense(item.payload);
  } else if (item.entity === 'expense_share') {
    await RawTrippinAPI.setShareSettled(tripId, item.entityId, item.payload.targetUserId, item.payload.settled, userId);
  }
}

// Processa a fila de uma viagem; itens que ainda falham por conectividade
// voltam para a fila (tenta de novo na próxima reconexão), erros de negócio
// genuínos são descartados e logados (H15.2), não travam o resto da fila.
async function flushPendingQueue(tripId, userId) {
  const queue = queueGet(tripId);
  if (!queue.length) return false;
  const remaining = [];
  let appliedAny = false;
  for (const item of queue) {
    try {
      await applyQueuedItem(item, tripId, userId);
      appliedAny = true;
    } catch (error) {
      if (isConnectivityError(error)) {
        remaining.push(item);
      } else {
        logClientError(error, { source: 'flushPendingQueue', item });
      }
    }
  }
  queueSet(tripId, remaining);
  if (appliedAny) {
    cacheKeysWithPrefix(`events_day_${tripId}_`).forEach(k => localStorage.removeItem(CACHE_PREFIX + k));
    cacheKeysWithPrefix(`events_range_${tripId}_`).forEach(k => localStorage.removeItem(CACHE_PREFIX + k));
    localStorage.removeItem(CACHE_PREFIX + `expenses_${tripId}`);
  }
  return appliedAny;
}

/* =========================================================================
   E15 / H15.2 — captura estruturada de erros e crashes do cliente.
   Grava em client_errors (Supabase); ninguém lê pela UI, é para revisão de
   engenharia via acesso direto ao banco. Nunca deixa uma falha de log
   derrubar o fluxo real — sempre best-effort, silencioso em caso de erro.
   ========================================================================= */
async function logClientError(error, context) {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    await supabaseClient.from('client_errors').insert({
      user_id: session ? session.user.id : null,
      message: String((error && error.message) || error || 'erro desconhecido'),
      stack: error && error.stack ? String(error.stack).slice(0, 4000) : null,
      context: context || {},
      user_agent: navigator.userAgent,
      url: location.href,
    });
  } catch (loggingError) {
    // Logging nunca pode virar uma segunda falha visível ao usuário.
  }
}

// Códigos de erro "esperados" — já viram uma mensagem amigável na tela
// (senha errada, e-mail em uso, código inválido, sem permissão). Não são bug,
// não entram no log — senão toda tentativa de senha errada viraria "crash".
const EXPECTED_ERROR_CODES = new Set(['EMAIL_IN_USE', 'WRONG_CREDENTIALS', 'TRIP_NOT_FOUND', 'FORBIDDEN']);

function redactArgsForLog(args) {
  try {
    return args.map(a => {
      if (a && typeof a === 'object' && !Array.isArray(a)) {
        const clone = Object.assign({}, a);
        delete clone.password;
        return clone;
      }
      return a;
    });
  } catch (e) { return null; }
}

// Envolve todo método de TrippinAPI: qualquer erro que não seja um dos
// códigos esperados acima é logado automaticamente, com o nome do método e
// os argumentos (sem senha) como contexto — cobre "qualquer erro de API não
// tratado" (H15.2) sem precisar instrumentar cada tela manualmente.
function withErrorLogging(api) {
  const wrapped = {};
  Object.keys(api).forEach((key) => {
    const original = api[key];
    if (typeof original !== 'function') { wrapped[key] = original; return; }
    wrapped[key] = async function (...args) {
      try {
        return await original.apply(api, args);
      } catch (error) {
        if (!EXPECTED_ERROR_CODES.has(error && error.message)) {
          logClientError(error, { source: 'TrippinAPI.' + key, args: redactArgsForLog(args) });
        }
        throw error;
      }
    };
  });
  return wrapped;
}

  // mesmo que a policy de profiles algum dia mude.
  async getTripFull(tripId) {
    return cachedRead(`tripfull_${tripId}`, async () => {
      const [tripRes, membersRes, auditRes, namesRes] = await Promise.all([
        supabaseClient.from('trips').select('*').eq('id', tripId).maybeSingle(),
        supabaseClient.from('trip_members').select('user_id, role, joined_at').eq('trip_id', tripId),
        supabaseClient.from('audit_log').select('id, message, created_at, user_id')
          .eq('trip_id', tripId).order('created_at', { ascending: false }),
        supabaseClient.rpc('get_trip_member_profiles', { p_trip_id: tripId }),
      ]);
      if (tripRes.error || !tripRes.data) return null;
      const nameByUserId = new Map((namesRes.data || []).map(p => [p.user_id, p.name || p.email]));
      const members = (membersRes.data || []).map(m => ({
        userId: m.user_id, role: m.role, joinedAt: m.joined_at,
        name: nameByUserId.get(m.user_id) || m.user_id,
      }));
      const auditLog = (auditRes.data || []).map(a => ({
        id: a.id, message: a.message, at: a.created_at,
        userName: nameByUserId.get(a.user_id) || 'alguém',
      }));
      return { trip: mapTrip(tripRes.data), members, auditLog };
    });
  },

  // ---- H4.4 Papéis e permissões — o RLS já garante que só Admin promove ----
  async promoteMember(tripId, actingUserId, targetUserId, newRole) {
    const { error } = await supabaseClient
      .from('trip_members').update({ role: newRole })
      .eq('trip_id', tripId).eq('user_id', targetUserId);
    if (error) throw new Error('FORBIDDEN');
    await this.addAuditEntry(tripId, actingUserId, `promoveu um integrante a ${newRole}`);
  },

  // ---- H4.5 Histórico leve de auditoria ----
  async addAuditEntry(tripId, userId, message) {
    await supabaseClient.from('audit_log').insert({ trip_id: tripId, user_id: userId, message });
  },

  // ---- H13.2 Notificações — geradas só pelas triggers do banco (member
  // joined, despesa impactando, conflito de agenda); o cliente só lê e marca
  // como lida. Lista todas as notificações do usuário, não só de uma viagem
  // (o drawer é global, não fica dentro do contexto de uma viagem aberta).
  async listNotifications(userId) {
    return cachedRead(`notifications_${userId}`, async () => {
      const { data, error } = await supabaseClient.from('notifications')
        .select('*, trip:trips(name)').eq('user_id', userId).order('created_at', { ascending: false }).limit(100);
      if (error) throw error;
      return (data || []).map(mapNotification);
    });
  },

  async countUnreadNotifications(userId) {
    const { count, error } = await supabaseClient.from('notifications')
      .select('id', { count: 'exact', head: true }).eq('user_id', userId).is('read_at', null);
    if (error) throw error;
    return count || 0;
  },

  async markNotificationRead(notificationId) {
    await supabaseClient.from('notifications').update({ read_at: new Date().toISOString() }).eq('id', notificationId);
  },

  async markAllNotificationsRead(userId) {
    await supabaseClient.from('notifications').update({ read_at: new Date().toISOString() })
      .eq('user_id', userId).is('read_at', null);
  },

  // ---- H5.2 Encerrar viagem manualmente (Admin) ----
  async closeTrip(tripId, userId) {
    const { error } = await supabaseClient.from('trips').update({ closed_at: new Date().toISOString() }).eq('id', tripId);
    if (error) throw new Error('FORBIDDEN');
    await this.addAuditEntry(tripId, userId, 'encerrou a viagem');
  },

  // ---- H6.1/H6.2/H6.6 Cronograma — CRUD de evento ----
  async _eventsWithParticipants(eventsRes) {
    if (eventsRes.error) throw eventsRes.error;
    const events = (eventsRes.data || []).map(mapEvent);
    if (events.length === 0) return [];
    const { data: partRows } = await supabaseClient.from('event_participants')
      .select('event_id, user_id').in('event_id', events.map(e => e.id));
    const participantsByEvent = new Map();
    (partRows || []).forEach(p => {
      if (!participantsByEvent.has(p.event_id)) participantsByEvent.set(p.event_id, []);
      participantsByEvent.get(p.event_id).push(p.user_id);
    });
    return events.map(e => ({ ...e, participantIds: participantsByEvent.get(e.id) || [] }));
  },

  async listEventsForDay(tripId, dayIso) {
    return cachedRead(`events_day_${tripId}_${dayIso}`, async () => {
      const eventsRes = await supabaseClient.from('schedule_events').select('*')
        .eq('trip_id', tripId).gte('starts_at', dayIso + 'T00:00:00').lte('starts_at', dayIso + 'T23:59:59.999')
        .order('sort_order', { ascending: true });
      return this._eventsWithParticipants(eventsRes);
    });
  },

  // H6.3 — Semana e Mês: mesma busca, intervalo de datas maior.
  async listEventsForRange(tripId, startIso, endIso) {
    return cachedRead(`events_range_${tripId}_${startIso}_${endIso}`, async () => {
      const eventsRes = await supabaseClient.from('schedule_events').select('*')
        .eq('trip_id', tripId).gte('starts_at', startIso + 'T00:00:00').lte('starts_at', endIso + 'T23:59:59.999')
        .order('starts_at', { ascending: true });
      return this._eventsWithParticipants(eventsRes);
    });
  },

  // H12.2 — se a chamada falhar por falta de conexão, o evento entra
  // otimisticamente no cache do dia (com pendingSync=true, visível na UI) e
  // uma operação equivalente vai para a fila local, reaplicada em
  // flushPendingQueue quando a conexão voltar (H12.3).
  async createEvent({ tripId, title, location, startsAt, endsAt, notes, userId, participantIds }) {
    const dayIso = startsAt.slice(0, 10);
    try {
      const { data: maxRow } = await supabaseClient.from('schedule_events').select('sort_order')
        .eq('trip_id', tripId).gte('starts_at', dayIso + 'T00:00:00').lte('starts_at', dayIso + 'T23:59:59.999')
        .order('sort_order', { ascending: false }).limit(1).maybeSingle();
      const nextOrder = (maxRow ? maxRow.sort_order : -1) + 1;
      const { data, error } = await supabaseClient.from('schedule_events')
        .insert({ trip_id: tripId, title, location: location || '', starts_at: startsAt, ends_at: endsAt || null, notes: notes || '', created_by: userId, sort_order: nextOrder })
        .select().single();
      if (error) throw error;
      if (participantIds && participantIds.length) {
        await supabaseClient.from('event_participants')
          .insert(participantIds.map(uid => ({ event_id: data.id, user_id: uid })));
      }
      return mapEvent(data);
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
      const optimistic = {
        id: localPendingId(), tripId, title, location: location || '', startsAt,
        endsAt: endsAt || null, notes: notes || '', createdBy: userId, sortOrder: 9999,
        participantIds: participantIds || [], pendingSync: true,
      };
      addCachedEvent(tripId, dayIso, optimistic);
      queuePush(tripId, {
        entity: 'event', op: 'create', entityId: optimistic.id, clientTimestamp: Date.now(),
        payload: { tripId, title, location, startsAt, endsAt, notes, userId, participantIds },
      });
      return optimistic;
    }
  },

  async updateEvent(eventId, patch, participantIds) {
    const applyLocalPatch = () => mutateCachedEvents(eventId, (ev) => ({
      ...ev,
      ...('title' in patch ? { title: patch.title } : {}),
      ...('location' in patch ? { location: patch.location } : {}),
      ...('startsAt' in patch ? { startsAt: patch.startsAt } : {}),
      ...('endsAt' in patch ? { endsAt: patch.endsAt } : {}),
      ...('notes' in patch ? { notes: patch.notes } : {}),
      ...(participantIds ? { participantIds } : {}),
      pendingSync: true,
    }));

    // Evento ainda não sincronizado (criado offline): não existe no servidor
    // ainda, então a edição só mescla no próprio payload da criação
    // enfileirada, sem gerar uma segunda operação de "update".
    if (String(eventId).startsWith('local_')) {
      const tripId = applyLocalPatch();
      if (tripId) {
        const queue = queueGet(tripId);
        const createItem = queue.find(q => q.entity === 'event' && q.op === 'create' && q.entityId === eventId);
        if (createItem) {
          Object.assign(createItem.payload, patch, participantIds ? { participantIds } : {});
          queueSet(tripId, queue);
        }
      }
      return;
    }

    try {
      const dbPatch = {};
      if ('title' in patch) dbPatch.title = patch.title;
      if ('location' in patch) dbPatch.location = patch.location;
      if ('startsAt' in patch) dbPatch.starts_at = patch.startsAt;
      if ('endsAt' in patch) dbPatch.ends_at = patch.endsAt;
      if ('notes' in patch) dbPatch.notes = patch.notes;
      const { error } = await supabaseClient.from('schedule_events').update(dbPatch).eq('id', eventId);
      if (error) throw error;
      if (participantIds) {
        await supabaseClient.from('event_participants').delete().eq('event_id', eventId);
        if (participantIds.length) {
          await supabaseClient.from('event_participants')
            .insert(participantIds.map(uid => ({ event_id: eventId, user_id: uid })));
        }
      }
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
      const tripId = applyLocalPatch();
      if (tripId) {
        queuePush(tripId, {
          entity: 'event', op: 'update', entityId: eventId, clientTimestamp: Date.now(),
          payload: { patch, participantIds },
        });
      }
    }
  },

  async deleteEvent(eventId) {
    if (String(eventId).startsWith('local_')) {
      const tripId = mutateCachedEvents(eventId, () => null);
      if (tripId) {
        const queue = queueGet(tripId).filter(q => !(q.entity === 'event' && q.op === 'create' && q.entityId === eventId));
        queueSet(tripId, queue);
      }
      return;
    }
    try {
      const { error } = await supabaseClient.from('schedule_events').delete().eq('id', eventId);
      if (error) throw error;
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
      const tripId = mutateCachedEvents(eventId, () => null);
      if (tripId) {
        queuePush(tripId, { entity: 'event', op: 'delete', entityId: eventId, clientTimestamp: Date.now() });
      }
    }
  },

  // H6.4 — reordenar dentro do mesmo dia: troca o sort_order de dois eventos.
  // Adaptação web da spec original (long-press + arrastar, pensada para
  // mobile nativo): sem gesto físico disponível fora de um app nativo, a
  // reordenação usa botões ↑/↓ trocando a posição com o vizinho. Fora do
  // escopo da fila offline (E12) — reordenar exige as duas linhas já
  // existentes no servidor; offline, é ignorado silenciosamente (não gera
  // erro nem entra na fila) em vez de arriscar uma reconciliação de ordem
  // complexa por um ganho pequeno.
  async swapEventOrder(eventA, eventB) {
    try {
      await Promise.all([
        supabaseClient.from('schedule_events').update({ sort_order: eventB.sortOrder }).eq('id', eventA.id),
        supabaseClient.from('schedule_events').update({ sort_order: eventA.sortOrder }).eq('id', eventB.id),
      ]);
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
    }
  },

  // ---- H7.1-H7.4 Despesas — multi-moeda, divisão igual, saldo ----
  async listExpenses(tripId) {
    return cachedRead(`expenses_${tripId}`, async () => {
      const [expensesRes, sharesRes] = await Promise.all([
        supabaseClient.from('expenses').select('*').eq('trip_id', tripId).order('created_at', { ascending: false }),
        supabaseClient.from('expense_shares').select('*'),
      ]);
      if (expensesRes.error) throw expensesRes.error;
      const expenses = (expensesRes.data || []).map(mapExpense);
      const expenseIds = new Set(expenses.map(e => e.id));
      const sharesByExpense = new Map();
      (sharesRes.data || []).forEach(s => {
        if (!expenseIds.has(s.expense_id)) return;
        if (!sharesByExpense.has(s.expense_id)) sharesByExpense.set(s.expense_id, []);
        sharesByExpense.get(s.expense_id).push({ userId: s.user_id, shareAmount: Number(s.share_amount), settled: s.settled });
      });
      return expenses.map(e => ({ ...e, shares: sharesByExpense.get(e.id) || [] }));
    });
  },

  // H7.5 (completo): splitMethod 'equal' divide o valor igualmente;
  // 'custom'/'fixed' usam os valores exatos de sharesMap (já validados no
  // cliente contra o total antes de chegar aqui).
  // H12.2 — offline, entra otimisticamente no cache de despesas + fila local.
  async createExpense({ tripId, eventId, description, amount, currency, paidBy, participantUserIds, splitMethod, sharesMap }) {
    const method = splitMethod || 'equal';
    try {
      const { data, error } = await supabaseClient.from('expenses')
        .insert({ trip_id: tripId, event_id: eventId || null, description, amount, currency, split_method: method, paid_by: paidBy })
        .select().single();
      if (error) throw error;
      let shares;
      if (method === 'equal') {
        const perShare = Math.round((amount / participantUserIds.length) * 100) / 100;
        shares = participantUserIds.map(uid => ({ expense_id: data.id, user_id: uid, share_amount: perShare }));
      } else {
        shares = participantUserIds.map(uid => ({ expense_id: data.id, user_id: uid, share_amount: sharesMap[uid] }));
      }
      await supabaseClient.from('expense_shares').insert(shares);
      return mapExpense(data);
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
      const perShare = method === 'equal' ? Math.round((amount / participantUserIds.length) * 100) / 100 : null;
      const shares = participantUserIds.map(uid => ({
        userId: uid, shareAmount: method === 'equal' ? perShare : sharesMap[uid], settled: false,
      }));
      const optimistic = {
        id: localPendingId(), tripId, eventId: eventId || null, description, amount: Number(amount),
        currency, splitMethod: method, paidBy, createdAt: new Date().toISOString(), shares, pendingSync: true,
      };
      const key = `expenses_${tripId}`;
      cacheSet(key, [optimistic].concat(cacheGet(key) || []));
      queuePush(tripId, {
        entity: 'expense', op: 'create', entityId: optimistic.id, clientTimestamp: Date.now(),
        payload: { tripId, eventId, description, amount, currency, paidBy, participantUserIds, splitMethod, sharesMap },
      });
      return optimistic;
    }
  },

  // H7.6 — quitação manual (não move dinheiro real, só marca a parte como
  // resolvida e registra no histórico).
  async setShareSettled(tripId, expenseId, targetUserId, settled, actingUserId) {
    // Despesa ainda não sincronizada (criada offline): quitar antes mesmo de
    // existir no servidor não é replicado na sincronização — caso raro,
    // registrado aqui como limitação conhecida em vez de fingir suportá-lo.
    if (String(expenseId).startsWith('local_')) {
      const key = `expenses_${tripId}`;
      const arr = cacheGet(key) || [];
      cacheSet(key, arr.map(exp => exp.id !== expenseId ? exp : {
        ...exp, shares: (exp.shares || []).map(s => s.userId === targetUserId ? { ...s, settled } : s),
      }));
      return;
    }
    try {
      const { error } = await supabaseClient.from('expense_shares')
        .update({ settled }).eq('expense_id', expenseId).eq('user_id', targetUserId);
      if (error) throw error;
      await this.addAuditEntry(tripId, actingUserId, settled ? 'quitou uma despesa' : 'reabriu uma despesa quitada');
    } catch (error) {
      if (!isConnectivityError(error)) throw error;
      const key = `expenses_${tripId}`;
      const arr = cacheGet(key) || [];
      cacheSet(key, arr.map(exp => exp.id !== expenseId ? exp : {
        ...exp, pendingSync: true,
        shares: (exp.shares || []).map(s => s.userId === targetUserId ? { ...s, settled } : s),
      }));
      queuePush(tripId, {
        entity: 'expense_share', op: 'update', entityId: expenseId, clientTimestamp: Date.now(),
        payload: { targetUserId, settled },
      });
    }
  },

  // ---- H10.1 Galeria — upload e listagem de fotos ----
  async uploadPhoto(tripId, file, userId) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const filename = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    const path = `${tripId}/${filename}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('trip-photos').upload(path, file);
    if (uploadError) throw uploadError;
    const { error: insertError } = await supabaseClient.from('trip_photos')
      .insert({ trip_id: tripId, uploaded_by: userId, storage_path: path });
    if (insertError) throw insertError;
  },

  // Bucket é privado (RLS por integrante) — sem URL pública. A tela busca uma
  // signed URL por foto sob demanda (getPhotoSignedUrl), não aqui.
  // H12.1 — cache de metadados (não do binário): a lista de fotos aparece
  // offline, mas abrir uma foto ainda exige rede para pedir a signed URL
  // (Storage privado, sem URL pública) — limitação arquitetural, não um
  // detalhe adiado.
  async listPhotos(tripId) {
    return cachedRead(`photos_${tripId}`, async () => {
      const { data, error } = await supabaseClient.from('trip_photos')
        .select('*').eq('trip_id', tripId).order('created_at', { ascending: false });
      if (error) throw error;
      return (data || []).map(row => ({
        id: row.id, tripId: row.trip_id, uploadedBy: row.uploaded_by,
        storagePath: row.storage_path, createdAt: row.created_at,
      }));
    });
  },

  async getPhotoSignedUrl(storagePath) {
    const { data, error } = await supabaseClient.storage.from('trip-photos').createSignedUrl(storagePath, 3600);
    if (error) throw error;
    return data.signedUrl;
  },

  async deletePhoto(photoId, storagePath) {
    await supabaseClient.storage.from('trip-photos').remove([storagePath]);
    const { error } = await supabaseClient.from('trip_photos').delete().eq('id', photoId);
    if (error) throw error;
  },

  // ---- H8.1 Docs — upload independe do resultado da extração ----
  async uploadDocument(tripId, file, userId) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const filename = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    const path = `${tripId}/${filename}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('trip-documents').upload(path, file);
    if (uploadError) throw uploadError;
    const { data, error: insertError } = await supabaseClient.from('documents')
      .insert({ trip_id: tripId, uploaded_by: userId, storage_path: path })
      .select().single();
    if (insertError) throw insertError;
    return { id: data.id, tripId: data.trip_id, uploadedBy: data.uploaded_by, storagePath: data.storage_path, extractedEventId: data.extracted_event_id, uploadedAt: data.uploaded_at };
  },

  // H12.1 — mesma ressalva do listPhotos: metadados ficam offline, o arquivo
  // em si (signed URL) só abre com conexão.
  async listDocuments(tripId) {
    return cachedRead(`documents_${tripId}`, async () => {
      const { data, error } = await supabaseClient.from('documents')
        .select('*').eq('trip_id', tripId).order('uploaded_at', { ascending: false });
      if (error) throw error;
      return (data || []).map(row => ({
        id: row.id, tripId: row.trip_id, uploadedBy: row.uploaded_by,
        storagePath: row.storage_path, extractedEventId: row.extracted_event_id, uploadedAt: row.uploaded_at,
      }));
    });
  },

  async getDocumentSignedUrl(storagePath) {
    const { data, error } = await supabaseClient.storage.from('trip-documents').createSignedUrl(storagePath, 3600);
    if (error) throw error;
    return data.signedUrl;
  },

  // H8.3 — liga o documento ao evento só depois da confirmação humana.
  async linkDocumentToEvent(documentId, eventId) {
    const { error } = await supabaseClient.from('documents').update({ extracted_event_id: eventId }).eq('id', documentId);
    if (error) throw error;
  },

  // H14.2 — exclusão remove o arquivo e a referência; o evento já confirmado
  // (se houver) permanece, exatamente como 00-F §13 documenta.
  async deleteDocument(documentId, storagePath, tripId, userId) {
    await supabaseClient.storage.from('trip-documents').remove([storagePath]);
    const { error } = await supabaseClient.from('documents').delete().eq('id', documentId);
    if (error) throw error;
    if (tripId) localStorage.removeItem(CACHE_PREFIX + `documents_${tripId}`);
    if (userId) localStorage.removeItem(CACHE_PREFIX + `all_documents_${userId}`);
  },

  // ---- H14.1 Privacidade e dados — lista todos os documentos de todas as
  // viagens do usuário (não só a viagem aberta no momento; a tela vem do
  // drawer, fora do contexto de uma viagem). RLS já restringe a linhas de
  // viagens onde o usuário é integrante — nenhum filtro explícito necessário.
  async listAllDocumentsForUser(userId) {
    return cachedRead(`all_documents_${userId}`, async () => {
      const [docsRes, memberRes] = await Promise.all([
        supabaseClient.from('documents').select('*, trip:trips(name)').order('uploaded_at', { ascending: false }),
        supabaseClient.from('trip_members').select('trip_id, role').eq('user_id', userId),
      ]);
      if (docsRes.error) throw docsRes.error;
      const roleByTrip = new Map((memberRes.data || []).map(m => [m.trip_id, m.role]));
      return (docsRes.data || []).map(row => ({
        id: row.id, tripId: row.trip_id, tripName: row.trip ? row.trip.name : '',
        uploadedBy: row.uploaded_by, storagePath: row.storage_path,
        extractedEventId: row.extracted_event_id, uploadedAt: row.uploaded_at,
        canDelete: row.uploaded_by === userId || roleByTrip.get(row.trip_id) === 'admin',
      }));
    });
  },
};

const TrippinAPI = withErrorLogging(RawTrippinAPI);

// Saldo do usuário atual por moeda: quanto pagou menos quanto era sua parte.
// Positivo = "te devem"; negativo = "você deve". Sem conversão entre moedas
// (decisão confirmada em 2026-08-28) — cada moeda tem seu próprio saldo.
// Fica fora de TrippinAPI de propósito: é uma função pura e síncrona — se
// estivesse dentro do objeto, o wrapper de log de erros (withErrorLogging)
// a transformaria em assíncrona sem querer, junto com todo o resto da API.
// H7.7 — extrato: saldo final de TODOS os integrantes, por moeda (não só do
// usuário atual). Mesma lógica de computeBalancesForUser, generalizada.
function computeAllBalances(expenses) {
  const balances = {}; // currency -> { userId -> amount }
  expenses.forEach(e => {
    balances[e.currency] = balances[e.currency] || {};
    e.shares.forEach(s => {
      if (s.userId === e.paidBy) return;
      if (s.settled) return;
      balances[e.currency][s.userId] = (balances[e.currency][s.userId] || 0) - s.shareAmount;
      balances[e.currency][e.paidBy] = (balances[e.currency][e.paidBy] || 0) + s.shareAmount;
    });
  });
  return balances;
}

function computeBalancesForUser(expenses, userId) {
  const balances = {};
  expenses.forEach(e => {
    balances[e.currency] = balances[e.currency] || 0;
    e.shares.forEach(s => {
      if (s.userId === e.paidBy) return; // parte do próprio pagador não é dívida
      if (s.settled) return; // já quitada (H7.6) — não conta mais no saldo
      if (s.userId === userId) balances[e.currency] -= s.shareAmount;
      if (e.paidBy === userId) balances[e.currency] += s.shareAmount;
    });
  });
  return balances;
}

/* =========================================================================
   Componentes base reutilizáveis (E1 / H1.2)
   ========================================================================= */
// E12 — status de conexão real do navegador, usado para o banner offline
// (H12.1) e para disparar a sincronização da fila ao reconectar (H12.3).
function useOnlineStatus() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    function goOnline() { setOnline(true); }
    function goOffline() { setOnline(false); }
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
  }, []);
  return online;
}

function AuthScreen({ lang, mode, setMode, onAuthed }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');

  const [submitting, setSubmitting] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setSubmitting(true);
    try {
      const profile = mode === 'signup'
        ? await TrippinAPI.signUp({ email, password, name })
        : await TrippinAPI.logIn({ email, password });
      onAuthed(profile);
    } catch (err) {
      if (err.message === 'EMAIL_IN_USE') setError(t(lang, 'emailInUse'));
      else if (err.message === 'WRONG_CREDENTIALS') setError(t(lang, 'wrongCredentials'));
      else setError(t(lang, 'genericError'));
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="screen">
      <h2>{mode === 'signup' ? t(lang, 'createAccount') : t(lang, 'login')}</h2>
      {error && <div className="banner-error">{error}</div>}
      <form onSubmit={submit}>
        {mode === 'signup' && (
          <div className="field">
            <label>{t(lang, 'name')}</label>
            <input value={name} onChange={e => setName(e.target.value)} required />
          </div>
        )}
        <div className="field">
          <label>{t(lang, 'email')}</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'password')}</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} />
        </div>
        <button className="btn btn-primary" type="submit" disabled={submitting}>
          {mode === 'signup' ? t(lang, 'createAccount') : t(lang, 'login')}
        </button>
      </form>
      <p className="hint" style={{ textAlign: 'center', marginTop: 16, cursor: 'pointer' }}
         onClick={() => setMode(mode === 'signup' ? 'login' : 'signup')}>
        {mode === 'signup' ? t(lang, 'haveAccount') : t(lang, 'noAccount')}
      </p>
    </div>
  );
}

function daysUntil(dateStr) {
  const diff = new Date(dateStr + 'T00:00:00') - new Date(new Date().toDateString());
  return Math.max(0, Math.ceil(diff / 86400000));
}

function HomeScreen({ lang, user, onOpenTrip, onGoCreate, onGoJoin }) {
  const [trips, setTrips] = useState(null); // null = carregando

  useEffect(() => {
    let alive = true;
    TrippinAPI.listTripsForUser(user.id).then(list => { if (alive) setTrips(list); });
    return () => { alive = false; };
  }, [user.id]);

  if (trips === null) {
    return <div className="screen"><p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p></div>;
  }

  const active = trips.filter(tr => computeTripStatus(tr) !== 'concluida');
  const past = trips.filter(tr => computeTripStatus(tr) === 'concluida');

  return (
    <div className="screen">
      <h2>{t(lang, 'yourTrips')}</h2>
      <div className="btn-block-row" style={{ marginBottom: 16 }}>
        <button className="btn btn-primary" onClick={onGoCreate}>{t(lang, 'createTrip')}</button>
        <button className="btn btn-secondary" onClick={onGoJoin}>{t(lang, 'joinTrip')}</button>
      </div>

      {active.length === 0
        ? <EmptyState title={t(lang, 'noTripsYet')} />
        : active.map(tr => {
            const status = computeTripStatus(tr);
            return (
              <div key={tr.id} onClick={() => onOpenTrip(tr.id)} style={{ cursor: 'pointer' }}>
                <Card>
                  <h3>{tr.name}</h3>
                  <p>{tr.startDate} → {tr.endDate}</p>
                  <p>{status === 'pre' ? t(lang, 'countdownDays', daysUntil(tr.startDate)) : t(lang, 'statusActive')}</p>
                </Card>
              </div>
            );
          })
      }

      {past.length > 0 && (
        <React.Fragment>
          <h2 style={{ marginTop: 24 }}>{t(lang, 'previousTrips')}</h2>
          {past.map(tr => (
            <div key={tr.id} onClick={() => onOpenTrip(tr.id)} style={{ cursor: 'pointer' }}>
              <Card><h3>{tr.name}</h3><p>{tr.startDate} → {tr.endDate}</p></Card>
            </div>
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

const DESTINATION_SUGGESTIONS = [
  'Lisboa, Portugal', 'Porto, Portugal', 'Roma, Itália', 'Paris, França',
  'Buenos Aires, Argentina', 'Santiago, Chile', 'Rio de Janeiro, Brasil',
  'São Paulo, Brasil', 'Nova York, EUA', 'Tóquio, Japão', 'Lima, Peru',

];

function CreateTripScreen({ lang, user, onCreated, onCancel }) {
  const [name, setName] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [destInput, setDestInput] = useState('');
  const [destinations, setDestinations] = useState([]);

  const suggestions = destInput.length >= 3
    ? DESTINATION_SUGGESTIONS.filter(d => d.toLowerCase().includes(destInput.toLowerCase()))
    : [];

  function addDestination(d) {
    if (d && !destinations.includes(d)) setDestinations([...destinations, d]);
    setDestInput('');
  }

  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setSubmitting(true);
    try {
      const trip = await TrippinAPI.createTrip({ name, startDate, endDate, destinations, ownerId: user.id });
      onCreated(trip.id);
    } catch (err) {
      setError(t(lang, 'genericError'));
      setSubmitting(false);
    }
  }

  return (
    <div className="screen">
      <h2>{t(lang, 'createTrip')}</h2>
      {error && <div className="banner-error">{error}</div>}
      <form onSubmit={submit}>
        <div className="field">
          <label>{t(lang, 'tripName')}</label>
          <input value={name} onChange={e => setName(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'startDate')}</label>
          <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'endDate')}</label>
          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} required min={startDate || undefined} />
        </div>
        <div className="field">
          <label>{t(lang, 'destinations')}</label>
          <input value={destInput} onChange={e => setDestInput(e.target.value)}
                 placeholder={lang === 'pt-BR' ? 'Digite ao menos 3 letras' : 'Type at least 3 letters'} />
          {suggestions.length > 0 && (
            <div className="card" style={{ marginTop: 6 }}>
              {suggestions.map(s => (
                <div key={s} className="hint" style={{ cursor: 'pointer', padding: '4px 0' }} onClick={() => addDestination(s)}>
                  {s}
                </div>
              ))}
            </div>
          )}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 }}>
            {destinations.map(d => (
              <span key={d} className="badge badge-convidado" onClick={() => setDestinations(destinations.filter(x => x !== d))} style={{ cursor: 'pointer' }}>
                {d} ✕
              </span>
            ))}
          </div>
        </div>
        <div className="btn-block-row">
          <button className="btn btn-secondary" type="button" onClick={onCancel}>✕</button>
          <button className="btn btn-primary" type="submit" disabled={submitting}>{t(lang, 'save')}</button>
        </div>
      </form>
    </div>
  );
}

function EventFormSheet({ lang, open, onClose, trip, dayIso, members, editingEvent, onSaved, userId, readOnly }) {
  const [title, setTitle] = useState('');
  const [location, setLocation] = useState('');
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');
  const [notes, setNotes] = useState('');
  const [participantIds, setParticipantIds] = useState([]);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (editingEvent) {
      setTitle(editingEvent.title);
      setLocation(editingEvent.location || '');
      setStartTime(editingEvent.startsAt.slice(11, 16));
      setEndTime(editingEvent.endsAt ? editingEvent.endsAt.slice(11, 16) : '');
      setNotes(editingEvent.notes || '');
      setParticipantIds(editingEvent.participantIds || []);
    } else {
      setTitle(''); setLocation(''); setStartTime(''); setEndTime(''); setNotes(''); setParticipantIds([]);
    }
  }, [editingEvent, open]);

  function toggleParticipant(uid) {
    setParticipantIds(prev => prev.includes(uid) ? prev.filter(x => x !== uid) : [...prev, uid]);
  }

  async function submit(e) {
    e.preventDefault();
    setSaving(true);
    try {
      const startsAt = `${dayIso}T${startTime}:00`;
      const endsAt = endTime ? `${dayIso}T${endTime}:00` : null;
      if (editingEvent) {
        await TrippinAPI.updateEvent(editingEvent.id, { title, location, startsAt, endsAt, notes }, participantIds);
      } else {
        await TrippinAPI.createEvent({ tripId: trip.id, title, location, startsAt, endsAt, notes, userId, participantIds });
      }
      onSaved();
    } finally {
      setSaving(false);
    }
  }

  async function remove() {
    await TrippinAPI.deleteEvent(editingEvent.id);
    onSaved();
  }

  return (
    <BottomSheet open={open} onClose={onClose}>
      <h3>{editingEvent ? t(lang, 'editEvent') : t(lang, 'addEvent')}</h3>
      <form onSubmit={submit}>
        <div className="field">
          <label>{t(lang, 'eventTitle')}</label>
          <input value={title} onChange={e => setTitle(e.target.value)} required disabled={readOnly} />
        </div>
        <div className="field">
          <label>{t(lang, 'location')}</label>
          <input value={location} onChange={e => setLocation(e.target.value)} disabled={readOnly} />
        </div>
        <div className="btn-block-row">
          <div className="field" style={{ flex: 1 }}>
            <label>{t(lang, 'startTime')}</label>
            <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} required disabled={readOnly} />
          </div>
          <div className="field" style={{ flex: 1 }}>
            <label>{t(lang, 'endTime')}</label>
            <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} disabled={readOnly} />
          </div>
        </div>
        <div className="field">
          <label>{t(lang, 'notes')}</label>
          <input value={notes} onChange={e => setNotes(e.target.value)} disabled={readOnly} />
        </div>
        <div className="field">
          <label>{t(lang, 'participants')}</label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {members.map(m => (
              <span key={m.userId}
                className={'badge ' + (participantIds.includes(m.userId) ? 'badge-admin' : 'badge-convidado')}
                style={{ cursor: readOnly ? 'default' : 'pointer' }}
                onClick={() => !readOnly && toggleParticipant(m.userId)}>
                {m.name}
              </span>
            ))}
          </div>
        </div>
        {!readOnly && (
          <div className="btn-block-row">
            {editingEvent && <button type="button" className="btn btn-danger" onClick={remove}>{t(lang, 'delete')}</button>}
            <button className="btn btn-primary" type="submit" disabled={saving}>{t(lang, 'save')}</button>
          </div>
        )}
      </form>
    </BottomSheet>
  );
}

function startOfWeekMonday(iso) {
  const d = new Date(iso + 'T00:00:00');
  const dow = d.getDay(); // 0=dom..6=sáb
  d.setDate(d.getDate() + ((dow === 0 ? -6 : 1) - dow));
  return toLocalDateIso(d);
}
function addDaysIso(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toLocalDateIso(d);
}

function DayView({ lang, trip, dayIso, setDayIso, events, readOnly, openNew, openEdit, onReorder }) {
  const isToday = dayIso === toLocalDateIso(new Date());
  const dayLabel = new Date(dayIso + 'T00:00:00')
    .toLocaleDateString(lang, { weekday: 'short', day: '2-digit', month: '2-digit' });

  return (
    <div>
      <div className="row-between" style={{ marginBottom: 12 }}>
        <button className="icon-btn" onClick={() => setDayIso(addDaysIso(dayIso, -1))} disabled={dayIso <= trip.startDate}>←</button>
        <strong>{isToday ? t(lang, 'today') + ' · ' : ''}{dayLabel}</strong>
        <button className="icon-btn" onClick={() => setDayIso(addDaysIso(dayIso, 1))} disabled={dayIso >= trip.endDate}>→</button>
      </div>

      {!readOnly && (
        <button className="btn btn-primary" style={{ marginBottom: 12 }} onClick={openNew}>{t(lang, 'addEvent')}</button>
      )}

      {events === null ? (
        <p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p>
      ) : events.length === 0 ? (
        <EmptyState title={t(lang, 'noEventsToday')} />
      ) : events.map((ev, idx) => {
        const hasConflict = events.some(other => other.id !== ev.id && eventsOverlap(ev, other));
        return (
          <Card key={ev.id}>
            <div className="row-between">
              <div onClick={() => openEdit(ev)} style={{ cursor: 'pointer', flex: 1 }}>
                <h3>{ev.startsAt.slice(11, 16)} — {ev.title}</h3>
                {ev.location && <p>{ev.location}</p>}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                {ev.pendingSync && (
                  <span className="badge badge-convidado" title={t(lang, 'pendingSyncBadge')}>⏳</span>
                )}
                {hasConflict && (
                  <span className="badge" style={{ background: 'var(--color-conflict)', color: '#211D1A' }} title={t(lang, 'conflictWarning')}>!</span>
                )}
                {!readOnly && events.length > 1 && (
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <button className="icon-btn" style={{ fontSize: 12, padding: '0 6px' }} disabled={idx === 0}
                      onClick={() => onReorder(ev, events[idx - 1])}>↑</button>
                    <button className="icon-btn" style={{ fontSize: 12, padding: '0 6px' }} disabled={idx === events.length - 1}
                      onClick={() => onReorder(ev, events[idx + 1])}>↓</button>
                  </div>
                )}
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function WeekView({ lang, trip, dayIso, onPickDay, rangeEvents }) {
  const weekStart = startOfWeekMonday(dayIso);
  const days = Array.from({ length: 7 }, (_, i) => addDaysIso(weekStart, i))
    .filter(d => d >= trip.startDate && d <= trip.endDate);

  return (
    <div>
      {days.length === 0 && <EmptyState title={t(lang, 'noEventsToday')} />}
      {days.map(d => {
        const dayEvents = (rangeEvents || []).filter(e => e.startsAt.slice(0, 10) === d);
        return (
          <div key={d} onClick={() => onPickDay(d)} style={{ cursor: 'pointer' }}>
            <Card>
              <h3>{new Date(d + 'T00:00:00').toLocaleDateString(lang, { weekday: 'short', day: '2-digit', month: '2-digit' })}</h3>
              {dayEvents.length === 0
                ? <p className="hint">{t(lang, 'noEventsToday')}</p>
                : dayEvents.map(ev => <p key={ev.id}>{ev.startsAt.slice(11, 16)} — {ev.title}</p>)
              }
            </Card>
          </div>
        );
      })}
    </div>
  );
}
