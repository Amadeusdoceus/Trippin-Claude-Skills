  return (
    <div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 4 }}>
        {weekdayLabels.map((w, i) => <div key={i} className="hint" style={{ textAlign: 'center' }}>{w}</div>)}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
        {cells.map(d => {
          const inMonth = new Date(d + 'T00:00:00').getMonth() === monthIndex;
          const inTrip = d >= trip.startDate && d <= trip.endDate;
          const count = eventsByDay.get(d) || 0;
          return (
            <div key={d} onClick={() => inTrip && onPickDay(d)}
              style={{
                textAlign: 'center', padding: '8px 2px', borderRadius: 8, cursor: inTrip ? 'pointer' : 'default',
                opacity: inMonth ? (inTrip ? 1 : 0.35) : 0.15,
                background: d === toLocalDateIso(new Date()) ? 'var(--color-border)' : 'transparent',
              }}>
              <div style={{ fontSize: 12 }}>{Number(d.slice(8, 10))}</div>
              {count > 0 && <div style={{ width: 4, height: 4, borderRadius: 2, background: 'var(--color-primary)', margin: '2px auto 0' }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScheduleScreen({ lang, trip, members, userId, readOnly, syncKey }) {
  const [dayIso, setDayIso] = useState(() => todayIsoWithinRange(trip));
  const [viewMode, setViewMode] = useState('day'); // H6.3: 'day' | 'week' | 'month'
  const [dayEvents, setDayEvents] = useState(null);
  const [rangeEvents, setRangeEvents] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    let alive = true;
    TrippinAPI.listEventsForDay(trip.id, dayIso).then(list => { if (alive) setDayEvents(list); });
    return () => { alive = false; };
  }, [trip.id, dayIso, reloadKey, syncKey]);

  useEffect(() => {
    if (viewMode === 'day') return;
    let alive = true;
    const rangeStart = viewMode === 'week' ? startOfWeekMonday(dayIso) : startOfWeekMonday(dayIso.slice(0, 8) + '01');
    const rangeEnd = viewMode === 'week' ? addDaysIso(rangeStart, 6) : addDaysIso(rangeStart, 41);
    TrippinAPI.listEventsForRange(trip.id, rangeStart, rangeEnd).then(list => { if (alive) setRangeEvents(list); });
    return () => { alive = false; };
  }, [trip.id, dayIso, viewMode, reloadKey, syncKey]);

  function openNew() { setEditingEvent(null); setSheetOpen(true); }
  function openEdit(ev) { setEditingEvent(ev); setSheetOpen(true); }
  function onSaved() { setSheetOpen(false); setReloadKey(k => k + 1); }
  function pickDay(d) { setDayIso(d); setViewMode('day'); }
  async function onReorder(a, b) { await TrippinAPI.swapEventOrder(a, b); setReloadKey(k => k + 1); }

  const viewTabs = [
    { key: 'day', label: lang === 'pt-BR' ? 'Dia' : 'Day' },
    { key: 'week', label: lang === 'pt-BR' ? 'Semana' : 'Week' },
    { key: 'month', label: lang === 'pt-BR' ? 'Mês' : 'Month' },
  ];

  return (
    <div>
      <SegmentedTabs tabs={viewTabs} active={viewMode} onChange={setViewMode} />
      {viewMode === 'day' && (
        <DayView lang={lang} trip={trip} dayIso={dayIso} setDayIso={setDayIso} events={dayEvents}
          readOnly={readOnly} openNew={openNew} openEdit={openEdit} onReorder={onReorder} />
      )}
      {viewMode === 'week' && (
        <WeekView lang={lang} trip={trip} dayIso={dayIso} onPickDay={pickDay} rangeEvents={rangeEvents} />
      )}
      {viewMode === 'month' && (
        <MonthView lang={lang} trip={trip} dayIso={dayIso} onPickDay={pickDay} rangeEvents={rangeEvents} />
      )}

      <EventFormSheet lang={lang} open={sheetOpen} onClose={() => setSheetOpen(false)} trip={trip} dayIso={dayIso}
        members={members} editingEvent={editingEvent} onSaved={onSaved} userId={userId} readOnly={readOnly} />
    </div>
  );
}

/* =========================================================================
   Telas — Viagem: Despesas (E7-mín / H7.1-H7.4)
   ========================================================================= */
function ExpenseFormSheet({ lang, open, onClose, trip, members, events, userId, onSaved, readOnly }) {
  const [description, setDescription] = useState('');
  const [amount, setAmount] = useState('');
  const [currency, setCurrency] = useState('BRL');
  const [eventId, setEventId] = useState('');
  const [paidBy, setPaidBy] = useState(userId);
  const [participantIds, setParticipantIds] = useState([]);
  const [splitMethod, setSplitMethod] = useState('equal'); // H7.5
  const [fixedAmounts, setFixedAmounts] = useState({}); // userId -> string
  const [parts, setParts] = useState({}); // userId -> string (peso)
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!open) return;
    setDescription(''); setAmount(''); setCurrency('BRL'); setEventId(''); setPaidBy(userId);
    setParticipantIds([]); setSplitMethod('equal'); setFixedAmounts({}); setParts({});
  }, [open, userId]);

  function onPickEvent(id) {
    setEventId(id);
    const ev = events.find(e => String(e.id) === String(id));
    setParticipantIds(ev ? ev.participantIds : []);
  }

  function toggleParticipant(uid) {
    setParticipantIds(prev => prev.includes(uid) ? prev.filter(x => x !== uid) : [...prev, uid]);
  }

  const totalNum = Number(amount) || 0;
  const fixedSum = participantIds.reduce((sum, uid) => sum + (Number(fixedAmounts[uid]) || 0), 0);
  const fixedMatches = Math.abs(fixedSum - totalNum) < 0.01;
  const canSubmit = participantIds.length > 0 && totalNum > 0 && (splitMethod !== 'fixed' || fixedMatches);

  function computeSharesMap() {
    if (splitMethod === 'fixed') {
      const map = {};
      participantIds.forEach(uid => { map[uid] = Math.round((Number(fixedAmounts[uid]) || 0) * 100) / 100; });
      return map;
    }
    if (splitMethod === 'custom') {
      const weights = participantIds.map(uid => Number(parts[uid]) || 1);
      const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;
      const map = {};
      participantIds.forEach((uid, i) => { map[uid] = Math.round((totalNum * weights[i] / totalWeight) * 100) / 100; });
      return map;
    }
    return null; // 'equal' — calculado no TrippinAPI
  }

  async function submit(e) {
    e.preventDefault();
    if (!canSubmit) return;
    setSaving(true);
    try {
      await TrippinAPI.createExpense({
        tripId: trip.id, eventId: eventId || null, description,
        amount: totalNum, currency, paidBy, participantUserIds: participantIds,
        splitMethod, sharesMap: computeSharesMap(),
      });
      onSaved();
    } finally {
      setSaving(false);
    }
  }

  return (
    <BottomSheet open={open} onClose={onClose}>
      <h3>{t(lang, 'addExpense')}</h3>
      <form onSubmit={submit}>
        <div className="field">
          <label>{t(lang, 'expenseDescription')}</label>
          <input value={description} onChange={e => setDescription(e.target.value)} required />
        </div>
        <div className="btn-block-row">
          <div className="field" style={{ flex: 2 }}>
            <label>{t(lang, 'amount')}</label>
            <input type="number" step="0.01" min="0.01" value={amount} onChange={e => setAmount(e.target.value)} required />
          </div>
          <div className="field" style={{ flex: 1 }}>
            <label>{t(lang, 'currency')}</label>
            <select value={currency} onChange={e => setCurrency(e.target.value)}>
              <option value="BRL">BRL</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>
        <div className="field">
          <label>{t(lang, 'linkToEvent')}</label>
          <select value={eventId} onChange={e => onPickEvent(e.target.value)}>
            <option value="">{t(lang, 'noEvent')}</option>
            {events.map(ev => (
              <option key={ev.id} value={ev.id}>{ev.startsAt.slice(11, 16)} — {ev.title}</option>
            ))}
          </select>
        </div>
        <div className="field">
          <label>{t(lang, 'paidBy')}</label>
          <select value={paidBy} onChange={e => setPaidBy(e.target.value)}>
            {members.map(m => <option key={m.userId} value={m.userId}>{m.name}</option>)}
          </select>
        </div>
        <div className="field">
          <label>{t(lang, 'splitEqually')}</label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {members.map(m => (
              <span key={m.userId}
                className={'badge ' + (participantIds.includes(m.userId) ? 'badge-admin' : 'badge-convidado')}
                style={{ cursor: 'pointer' }} onClick={() => toggleParticipant(m.userId)}>
                {m.name}
              </span>
            ))}
          </div>
        </div>
        <div className="field">
          <label>{t(lang, 'splitMethod')}</label>
          <select value={splitMethod} onChange={e => setSplitMethod(e.target.value)}>
            <option value="equal">{t(lang, 'splitMethodEqual')}</option>
            <option value="fixed">{t(lang, 'splitMethodFixed')}</option>
            <option value="custom">{t(lang, 'splitMethodCustom')}</option>
          </select>
        </div>
        {splitMethod === 'fixed' && participantIds.length > 0 && (
          <div className="field">
            {participantIds.map(uid => {
              const m = members.find(mm => mm.userId === uid);
              return (
                <div key={uid} className="btn-block-row" style={{ alignItems: 'center' }}>
                  <span style={{ flex: 1 }}>{m ? m.name : uid}</span>
                  <input type="number" step="0.01" min="0" style={{ flex: 1 }}
                    value={fixedAmounts[uid] || ''} onChange={e => setFixedAmounts({ ...fixedAmounts, [uid]: e.target.value })} />
                </div>
              );
            })}
            {!fixedMatches && <div className="error-text">{t(lang, 'fixedAmountsMismatch', totalNum.toFixed(2), currency)}</div>}
          </div>
        )}
        {splitMethod === 'custom' && participantIds.length > 0 && (
          <div className="field">
            <div className="hint">{t(lang, 'partsHint')}</div>
            {participantIds.map(uid => {
              const m = members.find(mm => mm.userId === uid);
              return (
                <div key={uid} className="btn-block-row" style={{ alignItems: 'center' }}>
                  <span style={{ flex: 1 }}>{m ? m.name : uid}</span>
                  <input type="number" step="1" min="1" style={{ flex: 1 }}
                    value={parts[uid] || '1'} onChange={e => setParts({ ...parts, [uid]: e.target.value })} />
                </div>
              );
            })}
          </div>
        )}
        <button className="btn btn-primary" type="submit" disabled={saving || !canSubmit}>{t(lang, 'save')}</button>
      </form>
    </BottomSheet>
  );
}

function StatementSheet({ lang, open, onClose, expenses, members }) {
  function memberName(uid) { const m = members.find(mm => mm.userId === uid); return m ? m.name : uid; }
  const allBalances = expenses ? computeAllBalances(expenses) : {};
  const currencies = Object.keys(allBalances);
  const totalsByCurrency = {};
  (expenses || []).forEach(e => { totalsByCurrency[e.currency] = (totalsByCurrency[e.currency] || 0) + e.amount; });

  return (
    <BottomSheet open={open} onClose={onClose}>
      <h3>{t(lang, 'statementTitle')}</h3>
      <h4>{t(lang, 'statementTotalByCurrency')}</h4>
      {Object.keys(totalsByCurrency).length === 0
        ? <p className="hint">{t(lang, 'noExpensesYet')}</p>
        : Object.keys(totalsByCurrency).map(c => <p key={c}>{c} {totalsByCurrency[c].toFixed(2)}</p>)
      }
      <h4 style={{ marginTop: 16 }}>{t(lang, 'statementByParticipant')}</h4>
      {currencies.length === 0
        ? <p className="hint">{t(lang, 'allSettled')}</p>
        : currencies.map(c => (
            <div key={c} style={{ marginBottom: 10 }}>
              <strong>{c}</strong>
              {members.map(m => {
                const v = (allBalances[c] && allBalances[c][m.userId]) || 0;
                if (Math.abs(v) < 0.005) return null;
                return (
                  <p key={m.userId} style={{ margin: '2px 0', color: v >= 0 ? 'var(--color-secondary)' : 'var(--color-danger)' }}>
                    {m.name}: {v >= 0 ? '+' : ''}{v.toFixed(2)}
                  </p>
                );
              })}
            </div>
          ))
      }
      <button className="btn btn-secondary" onClick={onClose}>{t(lang, 'close')}</button>
    </BottomSheet>
  );
}

function ExpensesScreen({ lang, trip, members, userId, readOnly, syncKey }) {
  const [expenses, setExpenses] = useState(null);
  const [events, setEvents] = useState([]);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [statementOpen, setStatementOpen] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    let alive = true;
    TrippinAPI.listExpenses(trip.id).then(list => { if (alive) setExpenses(list); });
    return () => { alive = false; };
  }, [trip.id, reloadKey, syncKey]);

  // Eventos de toda a viagem, para o seletor "vincular a um evento" — busca
  // dia a dia dentro do intervalo seria caro; para o MVP o número de dias de
  // uma viagem é pequeno o bastante para varrer de uma vez.
  useEffect(() => {
    let alive = true;
    (async () => {
      const days = [];
      let d = trip.startDate;
      while (d <= trip.endDate && days.length < 60) {
        days.push(d);
        const next = new Date(d + 'T00:00:00'); next.setDate(next.getDate() + 1);
        d = toLocalDateIso(next);
      }
      const results = await Promise.all(days.map(day => TrippinAPI.listEventsForDay(trip.id, day)));
      if (alive) setEvents(results.flat());
    })();
    return () => { alive = false; };
  }, [trip.id, trip.startDate, trip.endDate]);

  function memberName(userId) {
    const m = members.find(mm => mm.userId === userId);
    return m ? m.name : userId;
  }

  const balances = expenses ? computeBalancesForUser(expenses, userId) : {};
  const balanceCurrencies = Object.keys(balances).filter(c => Math.abs(balances[c]) > 0.005);

  async function toggleSettle(exp, share) {
    await TrippinAPI.setShareSettled(trip.id, exp.id, share.userId, !share.settled, userId);
    setReloadKey(k => k + 1);
  }

  return (
    <div>
      <div className="btn-block-row" style={{ marginBottom: 12 }}>
        {!readOnly && (
          <button className="btn btn-primary" onClick={() => setSheetOpen(true)}>{t(lang, 'addExpense')}</button>
        )}
        <button className="btn btn-secondary" onClick={() => setStatementOpen(true)}>{t(lang, 'viewStatement')}</button>
      </div>

      <Card>
        <h3>{t(lang, 'yourBalance')}</h3>
        {balanceCurrencies.length === 0
          ? <p className="hint">{t(lang, 'allSettled')}</p>
          : balanceCurrencies.map(c => (
              <p key={c} style={{ margin: '4px 0', color: balances[c] >= 0 ? 'var(--color-secondary)' : 'var(--color-danger)' }}>
                {balances[c] >= 0 ? t(lang, 'youAreOwed', balances[c].toFixed(2), c) : t(lang, 'youOwe', Math.abs(balances[c]).toFixed(2), c)}
              </p>
            ))
        }
      </Card>

      {expenses === null ? (
        <p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p>
      ) : expenses.length === 0 ? (
        <EmptyState title={t(lang, 'noExpensesYet')} />
      ) : expenses.map(exp => (
        <Card key={exp.id}>
          <div className="row-between">
            <div>
              <h3>{exp.description} {exp.pendingSync && <span className="badge badge-convidado" title={t(lang, 'pendingSyncBadge')}>⏳</span>}</h3>
              <p>{t(lang, 'paidByLabel', memberName(exp.paidBy))}</p>
            </div>
            <strong>{exp.currency} {exp.amount.toFixed(2)}</strong>
          </div>
          {exp.shares.filter(s => s.userId !== exp.paidBy).map(s => (
            <div key={s.userId} className="row-between" style={{ marginTop: 6 }}>
              <span className="hint">{memberName(s.userId)}: {exp.currency} {s.shareAmount.toFixed(2)}{s.settled ? ` · ${t(lang, 'settledLabel')}` : ''}</span>
              {!readOnly && (
                <button className="btn btn-secondary" style={{ width: 'auto', padding: '4px 10px', fontSize: 12 }}
                  onClick={() => toggleSettle(exp, s)}>
                  {s.settled ? t(lang, 'unsettle') : t(lang, 'settle')}
                </button>
              )}
            </div>
          ))}
        </Card>
      ))}

      <ExpenseFormSheet lang={lang} open={sheetOpen} onClose={() => setSheetOpen(false)} trip={trip}
        members={members} events={events} userId={userId}
        onSaved={() => { setSheetOpen(false); setReloadKey(k => k + 1); }} readOnly={readOnly} />
      <StatementSheet lang={lang} open={statementOpen} onClose={() => setStatementOpen(false)} expenses={expenses} members={members} />
    </div>
  );
}

/* =========================================================================
   Telas — Viagem: Docs com inteligência (E8 / H8.1-H8.5, diferencial central)
   ========================================================================= */
function DocConfirmSheet({ lang, open, onClose, trip, userId, candidate, documentId, onDone }) {
  const [title, setTitle] = useState('');
  const [location, setLocation] = useState('');
  const [date, setDate] = useState('');
  const [time, setTime] = useState('');
  const [notes, setNotes] = useState('');
  const [dayEvents, setDayEvents] = useState([]);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!open) return;
    setTitle(candidate.title || '');
    setLocation('');
    setDate(candidate.date || '');
    setTime(candidate.time || '');
    setNotes('');
  }, [open, candidate]);

  // H8.4 — checa conflito assim que houver data suficiente para comparar,
  // antes da confirmação (não depois de o evento já existir).
  useEffect(() => {
    if (!date) { setDayEvents([]); return; }
    let alive = true;
    TrippinAPI.listEventsForDay(trip.id, date).then(list => { if (alive) setDayEvents(list); });
    return () => { alive = false; };
  }, [trip.id, date]);

  const candidateEvent = date && time ? { id: null, startsAt: `${date}T${time}:00`, endsAt: null } : null;
  const hasConflict = candidateEvent && dayEvents.some(e => eventsOverlap(e, candidateEvent));
  const isEmptyExtraction = !candidate.date && !candidate.time;

  async function confirmCreate(e) {
    e.preventDefault();
    if (!date || !time || !title) return;
    setSaving(true);
    try {
      const startsAt = `${date}T${time}:00`;
      const event = await TrippinAPI.createEvent({
        tripId: trip.id, title, location, startsAt, endsAt: null, notes,
        userId, participantIds: [],
      });
      await TrippinAPI.linkDocumentToEvent(documentId, event.id);
      onDone();
    } finally {
      setSaving(false);
    }
  }

  return (
    <BottomSheet open={open} onClose={onClose}>
      <h3>{t(lang, 'confirmExtraction')}</h3>
      {isEmptyExtraction && <p className="hint">{t(lang, 'extractionEmptyHint')}</p>}
      <form onSubmit={confirmCreate}>
        <div className="field">
          <label>{t(lang, 'eventTitle')}</label>
          <input value={title} onChange={e => setTitle(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'location')}</label>
          <input value={location} onChange={e => setLocation(e.target.value)} />
        </div>
        <div className="btn-block-row">
          <div className="field" style={{ flex: 1 }}>
            <label>{t(lang, 'startDate')}</label>
            <input type="date" value={date} onChange={e => setDate(e.target.value)} required
              min={trip.startDate} max={trip.endDate} />
          </div>
          <div className="field" style={{ flex: 1 }}>
            <label>{t(lang, 'startTime')}</label>
            <input type="time" value={time} onChange={e => setTime(e.target.value)} required />
          </div>
        </div>
        <div className="field">
          <label>{t(lang, 'notes')}</label>
          <input value={notes} onChange={e => setNotes(e.target.value)} />
        </div>
        {hasConflict && <div className="banner-error">{t(lang, 'docConflictWarning')}</div>}
        <div className="btn-block-row">
          <button type="button" className="btn btn-secondary" onClick={onClose}>{t(lang, 'discardDocument')}</button>
          <button className="btn btn-primary" type="submit" disabled={saving}>{t(lang, 'createEventFromDoc')}</button>
        </div>
      </form>
    </BottomSheet>
  );
}

function DocsScreen({ lang, trip, members, userId, readOnly }) {
  const [documents, setDocuments] = useState(null);
  const [urls, setUrls] = useState({});
  const [processing, setProcessing] = useState(false);
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [candidate, setCandidate] = useState({ date: null, time: null, title: '' });
  const [pendingDocId, setPendingDocId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const fileInputRef = useRef(null);

  useEffect(() => {
    let alive = true;
    TrippinAPI.listDocuments(trip.id).then(async list => {
      if (!alive) return;
      setDocuments(list);
      const entries = await Promise.all(list.map(async d => [d.id, await TrippinAPI.getDocumentSignedUrl(d.storagePath)]));
      if (alive) setUrls(Object.fromEntries(entries));
    });
    return () => { alive = false; };
  }, [trip.id, reloadKey]);

  async function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setProcessing(true);
    try {
      // H8.1 — o upload acontece independente do resultado da extração.
      const doc = await TrippinAPI.uploadDocument(trip.id, file, userId);
      setReloadKey(k => k + 1);
      const extracted = await extractFromDocument(file); // H8.2 (ou H8.5 se falhar)
      setPendingDocId(doc.id);
      setCandidate(extracted);
      setConfirmOpen(true);
    } finally {
      setProcessing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  }

  return (
    <div>
      {!readOnly && (
        <div style={{ marginBottom: 12 }}>
          <input ref={fileInputRef} type="file" accept="image/*,.pdf" style={{ display: 'none' }} onChange={onFileSelected} />
          <button className="btn btn-primary" disabled={processing} onClick={() => fileInputRef.current.click()}>
            {t(lang, 'addDocument')}
          </button>
        </div>
      )}
      {processing && <p className="hint">{t(lang, 'readingDocument')}</p>}

      {documents === null ? (
        <p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p>
      ) : documents.length === 0 ? (
        <EmptyState title={t(lang, 'noDocumentsYet')} />
      ) : documents.map(doc => (
        <Card key={doc.id}>
          <div className="row-between">
            <div>
              <p className="hint">{new Date(doc.uploadedAt).toLocaleString(lang)}</p>
              {doc.extractedEventId && <p className="hint">✓ {t(lang, 'linkedToEvent')}</p>}
            </div>
            {urls[doc.id] && (
              <a href={urls[doc.id]} target="_blank" rel="noreferrer" className="btn btn-secondary" style={{ width: 'auto' }}>
                {t(lang, 'viewDocument')}
              </a>
            )}
          </div>
        </Card>
      ))}

      <DocConfirmSheet lang={lang} open={confirmOpen} onClose={() => setConfirmOpen(false)} trip={trip}
        userId={userId} candidate={candidate} documentId={pendingDocId}
        onDone={() => { setConfirmOpen(false); setReloadKey(k => k + 1); }} />
    </div>
  );
}

/* =========================================================================
   Telas — Viagem: Mapa (E9 / H9.1-H9.2)
   ========================================================================= */
function MapScreen({ lang, trip }) {
  const mapDivRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const [pins, setPins] = useState([]);
  const [loadingPins, setLoadingPins] = useState(true);
  const [searchTerm, setSearchTerm] = useState('');
  const [searchResults, setSearchResults] = useState([]);

  // Cria o mapa Leaflet uma vez por montagem da aba; destrói ao sair, senão o
  // Leaflet lança "Map container is already initialized" ao voltar à aba.
  useEffect(() => {
    mapInstanceRef.current = L.map(mapDivRef.current).setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    }).addTo(mapInstanceRef.current);
    return () => { mapInstanceRef.current && mapInstanceRef.current.remove(); mapInstanceRef.current = null; };
  }, []);

  // H9.1 — geocodifica destinos da viagem + locais de eventos com endereço.
  useEffect(() => {
    let alive = true;
    (async () => {
      setLoadingPins(true);
      const places = new Set(trip.destinations || []);
      const days = [];
      let d = trip.startDate;
      while (d <= trip.endDate && days.length < 60) { days.push(d); d = addDaysIso(d, 1); }
      const allEvents = (await Promise.all(days.map(day => TrippinAPI.listEventsForDay(trip.id, day)))).flat();
      allEvents.forEach(ev => { if (ev.location) places.add(ev.location); });

      const results = [];
      for (const place of places) {
        const geo = await geocodePlace(place);
        if (geo) results.push({ label: place, lat: geo.lat, lon: geo.lon });
        await new Promise(r => setTimeout(r, 300)); // respeita o limite de uso do Nominatim
      }
      if (alive) { setPins(results); setLoadingPins(false); }
    })();
    return () => { alive = false; };
  }, [trip.id]);

  useEffect(() => {
    if (!mapInstanceRef.current) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = pins.map(p => L.marker([p.lat, p.lon]).addTo(mapInstanceRef.current).bindPopup(p.label));
    if (pins.length > 0) {
      mapInstanceRef.current.fitBounds(L.latLngBounds(pins.map(p => [p.lat, p.lon])), { padding: [30, 30], maxZoom: 12 });
    }
  }, [pins]);

  // H9.2 — busca com debounce, mínimo de 3 letras, cache (geocodePlace).
  useEffect(() => {
    if (searchTerm.length < 3) { setSearchResults([]); return; }
    const handle = setTimeout(async () => {
      const geo = await geocodePlace(searchTerm);
      setSearchResults(geo ? [geo] : []);
    }, 400);
    return () => clearTimeout(handle);
  }, [searchTerm]);

  function flyToSearchResult(geo) {
    if (mapInstanceRef.current) mapInstanceRef.current.flyTo([geo.lat, geo.lon], 13);
  }

  return (
    <div>
      <div className="field">
        <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder={t(lang, 'searchPlacePlaceholder')} />
        {searchResults.map((r, i) => (
          <div key={i} className="card" style={{ marginTop: 6, cursor: 'pointer' }} onClick={() => flyToSearchResult(r)}>
            <p className="hint">{r.label}</p>
          </div>
        ))}
      </div>
      {loadingPins && <p className="hint">{t(lang, 'loadingPins')}</p>}
      {!loadingPins && pins.length === 0 && <p className="hint">{t(lang, 'noPinsYet')}</p>}
      <div ref={mapDivRef} style={{ height: 360, borderRadius: 'var(--radius-lg)', overflow: 'hidden' }} />
    </div>
  );
}

function GalleryScreen({ lang, trip, members, userId, readOnly }) {
  const [photos, setPhotos] = useState(null);
  const [urls, setUrls] = useState({});
  const [uploading, setUploading] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const fileInputRef = useRef(null);

  useEffect(() => {
    let alive = true;
    TrippinAPI.listPhotos(trip.id).then(async list => {
      if (!alive) return;
      setPhotos(list);
      const entries = await Promise.all(list.map(async p => [p.id, await TrippinAPI.getPhotoSignedUrl(p.storagePath)]));
      if (alive) setUrls(Object.fromEntries(entries));
    });
    return () => { alive = false; };
  }, [trip.id, reloadKey]);

  function memberName(uid) { const m = members.find(mm => mm.userId === uid); return m ? m.name : uid; }

  async function onFilesSelected(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploading(true);
    try {
      for (const file of files) await TrippinAPI.uploadPhoto(trip.id, file, userId);
      setReloadKey(k => k + 1);
    } finally {
      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  }

  return (
    <div>
      {!readOnly && (
        <div style={{ marginBottom: 12 }}>
          <input ref={fileInputRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={onFilesSelected} />
          <button className="btn btn-primary" disabled={uploading} onClick={() => fileInputRef.current.click()}>
            {t(lang, 'uploadPhoto')}
          </button>
        </div>
      )}
      {photos === null ? (
        <p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p>
      ) : photos.length === 0 ? (
        <EmptyState title={t(lang, 'noPhotosYet')} />
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
          {photos.map(p => (
            <div key={p.id} style={{ aspectRatio: '1', borderRadius: 'var(--radius-md)', overflow: 'hidden', background: 'var(--color-border)' }}
              title={t(lang, 'uploadedBy', memberName(p.uploadedBy))}>
              {urls[p.id] && <img src={urls[p.id]} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

   ========================================================================= */
function computeFreeTimeSuggestions(dayEvents, destinations) {
  if (!destinations || destinations.length === 0) return [];
  const sorted = [...dayEvents].sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
  const gaps = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const end = sorted[i].endsAt ? new Date(sorted[i].endsAt) : new Date(sorted[i].startsAt);
    const nextStart = new Date(sorted[i + 1].startsAt);
    const freeMinutes = (nextStart - end) / 60000;
    if (freeMinutes >= 90) {
      gaps.push({ start: end, end: nextStart, destination: destinations[i % destinations.length] });
    }
  }
  return gaps;
}

function SuggestionsScreen({ lang, trip }) {
  const [dayEvents, setDayEvents] = useState(null);

  useEffect(() => {
    let alive = true;
    TrippinAPI.listEventsForDay(trip.id, todayIsoWithinRange(trip)).then(list => { if (alive) setDayEvents(list); });

  }, [trip.id]);

  if (dayEvents === null) return <p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p>;

  const suggestions = computeFreeTimeSuggestions(dayEvents, trip.destinations);
  return (
    <div>

      {suggestions.length === 0
        ? <EmptyState title={t(lang, 'noSuggestions')} />
        : suggestions.map((s, i) => (
            <Card key={i}>
              <p>{t(lang, 'freeTimeSuggestion',
                s.start.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' }),
                s.end.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' }),
                s.destination)}</p>
            </Card>
          ))
      }
    </div>
  );
}

function TripScreen({ lang, tripId, user }) {
  const [activeTab, setActiveTab] = useState('schedule');
  // H12.4 — adaptação web do "splash durante cache-busting" da spec original
  // (pensada para um wrapper mobile nativo, que não existe aqui): em vez de
  // uma splash screen própria, o estado inicial já nasce do cache local, se
  // houver — a tela nunca fica em branco/só "Carregando…" quando já existe
  // um retrato salvo da viagem, mesmo antes da resposta de rede chegar.
  const [data, setData] = useState(() => cacheGet(`tripfull_${tripId}`));
  const [reloadKey, setReloadKey] = useState(0);
  const online = useOnlineStatus();
  const [pendingCount, setPendingCount] = useState(() => queuePendingCount(tripId));

  useEffect(() => {
    let alive = true;
    TrippinAPI.getTripFull(tripId).then(result => { if (alive) setData(result); });
    return () => { alive = false; };
  }, [tripId, reloadKey]);

  // H12.3 — tenta sincronizar a fila local sempre que a conexão volta (evento
  // 'online') ou a tela é aberta já online com pendências de uma sessão
  // offline anterior.
  useEffect(() => {
    if (!online) return;
    let alive = true;
    flushPendingQueue(tripId, user.id).then(applied => {
      if (!alive) return;
      setPendingCount(queuePendingCount(tripId));
      if (applied) setReloadKey(k => k + 1);
    });
    return () => { alive = false; };
  }, [online, tripId]);

  useEffect(() => {
    function onQueueChanged(e) {
      if (e.detail && e.detail.tripId === tripId) setPendingCount(queuePendingCount(tripId));
    }
    window.addEventListener('trippin:queue-changed', onQueueChanged);
    return () => window.removeEventListener('trippin:queue-changed', onQueueChanged);
  }, [tripId]);

  if (data === null) {
    return <div className="screen"><p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p></div>;
  }
  if (!data.trip) return <div className="screen"><EmptyState title={t(lang, 'invalidCode')} /></div>;

  const myRole = (data.members.find(m => m.userId === user.id) || {}).role || null;
  const status = computeTripStatus(data.trip); // H5.2: 'pre' | 'ativa' | 'concluida'
  const readOnly = status === 'concluida'; // H5.4
  const onChanged = () => setReloadKey(k => k + 1);

  const tabs = [
    { key: 'schedule', label: t(lang, 'schedule') },
    { key: 'expenses', label: t(lang, 'expensesTab') },
    { key: 'map', label: t(lang, 'map') },
    { key: 'docs', label: t(lang, 'docs') },
    { key: 'gallery', label: t(lang, 'gallery') },
    { key: 'suggestions', label: t(lang, 'suggestions') },
    { key: 'members', label: t(lang, 'members') },
  ];

  return (
    <div className="screen">
      <div className="row-between">
        <h2>{data.trip.name}</h2>
        <span className="badge badge-convidado">{t(lang, status === 'pre' ? 'statusPre' : status === 'ativa' ? 'statusActive' : 'statusDone')}</span>
      </div>
      {readOnly && <div className="hint" style={{ marginBottom: 12 }}>{t(lang, 'tripEnded')}</div>}
      {!online && <div className="banner-error" style={{ background: 'var(--color-text-muted)' }}>{t(lang, 'offlineBanner')}</div>}
      {online && pendingCount > 0 && <div className="hint" style={{ marginBottom: 12 }}>{t(lang, 'pendingSyncCount', pendingCount)}</div>}
      <SegmentedTabs tabs={tabs} active={activeTab} onChange={setActiveTab} />
      {activeTab === 'schedule' && (
        <ScheduleScreen lang={lang} trip={data.trip} members={data.members} userId={user.id} readOnly={readOnly} syncKey={reloadKey} />
      )}
      {activeTab === 'expenses' && (
        <ExpensesScreen lang={lang} trip={data.trip} members={data.members} userId={user.id} readOnly={readOnly} syncKey={reloadKey} />
      )}
      {activeTab === 'members' && (
        <MembersScreen lang={lang} tripId={tripId} tripCode={data.trip.code} members={data.members}
          auditLog={data.auditLog} myRole={myRole} currentUserId={user.id}
          onChanged={onChanged} readOnly={readOnly} />
      )}
      {activeTab === 'map' && <MapScreen lang={lang} trip={data.trip} />}
      {activeTab === 'gallery' && (
        <GalleryScreen lang={lang} trip={data.trip} members={data.members} userId={user.id} readOnly={readOnly} />
      )}
      {activeTab === 'suggestions' && <SuggestionsScreen lang={lang} trip={data.trip} />}
      {activeTab === 'docs' && (
        <DocsScreen lang={lang} trip={data.trip} members={data.members} userId={user.id} readOnly={readOnly} />
      )}
    </div>
  );
}

// H13.2 — mensagem renderizada no idioma atual a partir do payload salvo no
// banco (não uma string pronta em pt-BR, ao contrário do audit_log — aqui o
// usuário pode estar em qualquer um dos idiomas suportados).
function notificationMessage(lang, n) {
  const p = n.payload || {};
  if (n.type === 'member_joined') return t(lang, 'notifMemberJoined', p.memberName, n.tripName);
  if (n.type === 'expense_impact') return t(lang, 'notifExpenseImpact', p.description, Number(p.amount).toFixed(2), p.currency, n.tripName);
  if (n.type === 'schedule_conflict') return t(lang, 'notifScheduleConflict', p.eventTitle, p.conflictTitle, n.tripName);
  return '';
}

function NotificationsScreen({ lang, user, onChanged }) {

  useEffect(() => {
    let alive = true;
    TrippinAPI.listNotifications(user.id).then(list => { if (alive) setNotifications(list); });

  async function markRead(n) {
    if (n.readAt) return;
    await TrippinAPI.markNotificationRead(n.id);

/* =========================================================================
   App — orquestração de navegação (sem router: estado local é suficiente
   para o número de telas da Fase A)
   ========================================================================= */
function App() {
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [lang, setLang] = useState('pt-BR');
  const [authMode, setAuthMode] = useState('signup');
  const [screen, setScreen] = useState('language');
  const [tripId, setTripId] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [unreadCount, setUnreadCount] = useState(0);

  // Sessão do Supabase é restaurada automaticamente do localStorage pelo
  // próprio cliente (persistSession, padrão do supabase-js) — aqui só
  // buscamos o perfil correspondente para decidir a tela inicial.
  useEffect(() => {
    let alive = true;
    TrippinAPI.getCurrentProfile().then(profile => {
      if (!alive) return;
      if (profile) {
        setUser(profile);
        setLang(profile.language || 'pt-BR');
        setScreen(profile.onboarded ? 'home' : 'onboarding-profile');
      }
      setAuthChecked(true);
    });
    return () => { alive = false; };
  }, []);

  // H13.2 — contagem de não lidas para o badge do sino no drawer; refeita ao
  // logar e sempre que a tela de Notificações reporta uma mudança.
  const refreshUnreadCount = React.useCallback(() => {
    if (user) TrippinAPI.countUnreadNotifications(user.id).then(setUnreadCount);
  }, [user && user.id]);
  useEffect(() => { refreshUnreadCount(); }, [user && user.id]);

  function handleChooseLanguage(l) { setLang(l); setScreen('auth'); }
  function handleAuthed(profile) {
    setUser(profile);
    setLang(profile.language || lang);
    setScreen(profile.onboarded ? 'home' : 'onboarding-profile');
  }
  function handleOnboarded(profile) { setUser(profile); setScreen('home'); }
  async function handleLogout() {
    await TrippinAPI.logOut();
    setUser(null);
    setScreen('language');
    setDrawerOpen(false);
  }
  async function handleChangeLanguage(l) {
    setLang(l);
    if (user) {
      const updated = await TrippinAPI.updateProfile(user.id, { language: l });
      setUser(updated);
    }
  }

  if (!authChecked) {
    return <div style={{ padding: 24, fontFamily: 'system-ui, sans-serif' }}>Carregando Trippin…</div>;
  }
  if (screen === 'language') return <LanguageScreen onChoose={handleChooseLanguage} />;
  if (screen === 'auth') return <AuthScreen lang={lang} mode={authMode} setMode={setAuthMode} onAuthed={handleAuthed} />;
  if (screen === 'onboarding-profile') return <OnboardingProfileScreen lang={lang} user={user} onDone={handleOnboarded} />;

  const tabScreen = ['home', 'create-trip', 'join-trip'].includes(screen) ? 'home'
    : screen === 'trip' ? 'trip'
    : screen === 'profile' ? 'profile'
    : 'home';

  const titles = { home: t(lang, 'appName'), trip: t(lang, 'trip'), profile: t(lang, 'profile'),
                   'create-trip': t(lang, 'createTrip'), 'join-trip': t(lang, 'joinTrip'),
                   notifications: t(lang, 'notifications'), settings: t(lang, 'settings'), privacy: t(lang, 'privacyData') };

  return (
    <div className="app-shell">
      <TopBar
        title={titles[screen] || t(lang, 'appName')}
        onMenu={() => setDrawerOpen(true)}
        onBack={['create-trip', 'join-trip', 'notifications', 'settings', 'privacy'].includes(screen) ? () => setScreen('home') : null}
      />

      {screen === 'home' && (
        <HomeScreen lang={lang} user={user}
          onOpenTrip={(id) => { setTripId(id); setScreen('trip'); }}
          onGoCreate={() => setScreen('create-trip')}
          onGoJoin={() => setScreen('join-trip')} />
      )}
      {screen === 'create-trip' && (
        <CreateTripScreen lang={lang} user={user}
          onCreated={(id) => { setTripId(id); setScreen('trip'); }}
          onCancel={() => setScreen('home')} />
      )}
      {screen === 'join-trip' && (
        <JoinTripScreen lang={lang} user={user}
          onJoined={(id) => { setTripId(id); setScreen('trip'); }}
          onCancel={() => setScreen('home')} />
      )}
      {screen === 'trip' && (
        <TripScreen lang={lang} tripId={tripId} user={user} />
      )}
      {screen === 'profile' && (
        <ProfileScreen lang={lang} user={user} onUpdate={setUser} onChangeLanguage={handleChangeLanguage} />
      )}
      {screen === 'notifications' && (
        <NotificationsScreen lang={lang} user={user} onChanged={refreshUnreadCount} />
      )}
      {screen === 'privacy' && (
        <PrivacyDataScreen lang={lang} user={user} />
      )}
      {screen === 'settings' && (
        <PlaceholderScreen lang={lang} title={titles[screen]} />
      )}

      <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} lang={lang} onLogout={handleLogout}
        unreadCount={unreadCount}
        onNavigate={(dest) => { setDrawerOpen(false); setScreen(dest); if (dest === 'notifications') refreshUnreadCount(); }} />

      <TabBar active={tabScreen} lang={lang} onChange={(key) => setScreen(key)} />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, errorInfo) {
    logClientError(error, { source: 'ErrorBoundary', componentStack: errorInfo && errorInfo.componentStack });
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 24, fontFamily: 'system-ui, sans-serif' }}>
          <h2 style={{ color: '#B3413A' }}>Algo deu errado ao carregar o Trippin</h2>
          <p style={{ color: '#6B6259' }}>Recarregue a página. Se o problema persistir, avise o time.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

// Captura erros de runtime e promises rejeitadas sem handler que aconteçam
// depois do app já ter montado (fora do que o ErrorBoundary do React alcança,
// que só cobre erros durante o render). Falhas de bootstrap (antes daqui)
// já têm seu próprio fallback estático mais acima no arquivo.
window.addEventListener('error', (event) => {
  logClientError(event.error || event.message, { source: 'window.onerror' });
});
window.addEventListener('unhandledrejection', (event) => {
  logClientError(event.reason, { source: 'unhandledrejection' });
});

const rootEl = document.getElementById('root');
rootEl.dataset.mounted = 'true';
ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

<script>
  // Transformação manual via Babel.transform (em vez do scanner automático de
  // <script type="text/babel">), que em algumas versões do CDN tenta buscar presets
  // adicionais de uma URL sem versão e quebra com "Cannot use import statement
  // outside a module". Chamar Babel.transform diretamente evita esse caminho.
  var jsxSource = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(jsxSource, { presets: ['react'] }).code;
  var executable = document.createElement('script');
  executable.textContent = compiled;
  document.body.appendChild(executable);
</script>
