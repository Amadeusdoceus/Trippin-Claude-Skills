<style>
  /* ---------- E1 / H1.1 — Tokens "Golden Hour" (claro e escuro) ---------- */
  :root {
    --color-primary: #E2673A;        /* terracota/coral */
    --color-primary-contrast: #FFFFFF;
    --color-secondary: #1F5C56;      /* verde-petróleo profundo */
    --color-surface: #FBF4EA;        /* areia/creme */
    --color-surface-raised: #FFFFFF;
    --color-border: #E7D9C6;
    --color-text: #211D1A;           /* quase-preto, não preto puro */
    --color-text-muted: #6B6259;
    --color-danger: #B3413A;
    --color-conflict: #F0B429;
    --radius-md: 12px;
    --radius-lg: 20px;
    --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --tracking-tight: -0.01em;
    --tracking-wide: 0.02em;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-primary: #F0794C;
      --color-primary-contrast: #1A1512;
      --color-secondary: #4FBDAF;
      --color-surface: #171A24;      /* azul-crepúsculo profundo */
      --color-surface-raised: #20242F;
      --color-border: #2E3342;
      --color-text: #F3EFEA;
      --color-text-muted: #A8A296;
      --color-danger: #E2857D;
      --color-conflict: #F0B429;
    }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    background: var(--color-surface);
    color: var(--color-text);
    letter-spacing: var(--tracking-tight);
  }
  h1, h2, h3 { letter-spacing: var(--tracking-tight); }
  small, .label { letter-spacing: var(--tracking-wide); }
  button { font-family: inherit; }

  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .app-shell { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 72px; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--color-surface-raised);
    border-bottom: 1px solid var(--color-border);
    position: sticky; top: 0; z-index: 10;

  .top-bar h1 { font-size: 17px; margin: 0; }
  .icon-btn {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--color-text); padding: 4px 8px; border-radius: var(--radius-md);
  }
  .icon-btn:hover { background: var(--color-border); }

  .screen { flex: 1; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }

  /* ---------- E1 / H1.2 — Componentes base reutilizáveis ---------- */

  /* Card — usado em Home (lista de viagens), Integrantes e Log de auditoria */
  .card {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card p { margin: 0; color: var(--color-text-muted); font-size: 13px; }

  /* Botões */
  .btn {
    border: none; border-radius: var(--radius-md); padding: 12px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--color-primary); color: var(--color-primary-contrast); }
  .btn-secondary { background: transparent; color: var(--color-secondary); border: 1px solid var(--color-secondary); }
  .btn-danger { background: transparent; color: var(--color-danger); border: 1px solid var(--color-danger); }
  .btn-block-row { display: flex; gap: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--color-text-muted); }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border); background: var(--color-surface-raised);
    color: var(--color-text); font-size: 14px; font-family: inherit;
  }

  .error-text { font-size: 12px; color: var(--color-danger); margin-top: 4px; }

    font-family: monospace; font-size: 22px; letter-spacing: 2px; font-weight: 700;

<script>
  // Mitigação adicional do risco de "tela branca" (00-F §11 / decisão #1): captura erros
  // não tratados do runtime e mostra uma mensagem legível em vez de uma tela vazia.
  window.addEventListener('error', function (event) {
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      root.innerHTML =
        '<div style="padding:24px;font-family:system-ui,sans-serif;">' +
        '<h2 style="color:#B3413A;">Algo deu errado ao carregar o Trippin</h2>' +
        '<p style="color:#6B6259;">Recarregue a página. Se o problema persistir, avise o time.</p>' +
        '</div>';
    }
  });
</script>

/* =========================================================================
   TrippinAPI — camada de persistência mock (localStorage).
   Implementa hoje a interface que, na Fase A/E2, passa a chamar Supabase.
   Nenhuma tela deve tocar localStorage diretamente — só via TrippinAPI.
   ========================================================================= */
// Chave publishable — pode ser pública (decisão de tecnologia #4, 00-F §10);
// quem protege os dados é o RLS do banco, não o segredo desta chave.
const SUPABASE_URL = 'https://wwnxrzdmdhdgzokmbvud.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_n9Nxu9sNszlXNHTpSKLCCw_A3aLsG37';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function randomDigits(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 10);
  return s;
}

function mapProfile(row) {
  if (!row) return null;
  return {
    id: row.id, email: row.email, name: row.name, phone: row.phone, cpf: row.cpf,
    userCode: row.user_code, language: row.language, onboarded: row.onboarded,
    createdAt: row.created_at,
  };
}
function mapTrip(row) {
  if (!row) return null;
  return {
    id: row.id, code: row.code, name: row.name,
    startDate: row.start_date, endDate: row.end_date,
    destinations: row.destinations || [], createdBy: row.created_by, createdAt: row.created_at,
  };
}

const TrippinAPI = {
  // ---- H3.1 Cadastro e login por e-mail + senha, via Supabase Auth ----
  // O perfil (com código de usuário de 6 dígitos) é criado por um trigger no
  // banco quando o usuário é inserido em auth.users — ver supabase/migrations.
  async signUp({ email, password, name }) {
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) throw new Error('SIGNUP_FAILED');
    // Anti-enumeração do GoTrue: e-mail já cadastrado volta sem erro explícito,
    // mas com identities vazio.
    if (!data.user || (data.user.identities && data.user.identities.length === 0)) {
      throw new Error('EMAIL_IN_USE');
    }
    if (name) {
      await supabaseClient.from('profiles').update({ name }).eq('id', data.user.id);
    }
    return this.getCurrentProfile();
  },
  async logIn({ email, password }) {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw new Error('WRONG_CREDENTIALS');
    return this.getCurrentProfile();
  },
  async logOut() {
    await supabaseClient.auth.signOut();
  },
  async getCurrentProfile() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return null;
    const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if (error) return null;
    return mapProfile(data);
  },

  // ---- H3.2 / H3.3 Onboarding + CPF opcional ----
  async updateProfile(userId, patch) {
    const { data, error } = await supabaseClient.from('profiles').update(patch).eq('id', userId).select().single();
    if (error) throw error;
    return mapProfile(data);
  },

  // ---- H4.1 Criar viagem (código de 12 dígitos gerado no cliente, com
  // nova tentativa em caso de colisão contra a restrição unique do banco) ----
  async createTrip({ name, startDate, endDate, destinations, ownerId }) {
    let row = null;
    for (let attempt = 0; attempt < 5 && !row; attempt++) {
      const code = randomDigits(12);
      const { data, error } = await supabaseClient
        .from('trips')
        .insert({
          name, start_date: startDate, end_date: endDate,
          destinations: destinations || [], created_by: ownerId, code,
        })
        .select().single();
      if (!error) { row = data; break; }
      if (error.code !== '23505') throw error;
    }
    if (!row) throw new Error('COULD_NOT_CREATE_TRIP');
    await this.addAuditEntry(row.id, ownerId, `criou a viagem "${name}"`);
    return mapTrip(row);
  },

  // ---- H4.2 Participar por código ----
  // Quem ainda não é integrante não pode fazer SELECT direto em trips (correto,
  // protege dados de outras viagens). "Buscar + entrar" viram uma única
  // função security definer (join_trip_by_code) — é a ÚNICA forma de virar
  // convidado; não existe mais um insert direto liberado por RLS, exatamente
  // para impedir que alguém vire membro de uma viagem só adivinhando o id.
  async joinTrip({ code }) {
    const { data, error } = await supabaseClient.rpc('join_trip_by_code', { p_code: code });
    if (error) throw new Error('TRIP_NOT_FOUND');
    return mapTrip(data);
  },

  async listTripsForUser(userId) {
    const { data, error } = await supabaseClient
      .from('trip_members').select('trip:trips(*)').eq('user_id', userId);
    if (error) throw error;
    return (data || []).map(row => mapTrip(row.trip)).filter(Boolean);
  },

  // Busca a viagem + integrantes + histórico de auditoria. Nomes de outros
  // integrantes vêm de get_trip_member_profiles (não de um join direto em
  // profiles) — essa função só devolve id/nome/e-mail, nunca CPF/telefone,
  // mesmo que a policy de profiles algum dia mude.
  async getTripFull(tripId) {
    const [tripRes, membersRes, auditRes, namesRes] = await Promise.all([
      supabaseClient.from('trips').select('*').eq('id', tripId).maybeSingle(),
      supabaseClient.from('trip_members').select('user_id, role, joined_at').eq('trip_id', tripId),
      supabaseClient.from('audit_log').select('id, message, created_at, user_id')
        .eq('trip_id', tripId).order('created_at', { ascending: false }),
      supabaseClient.rpc('get_trip_member_profiles', { p_trip_id: tripId }),
    ]);
    if (tripRes.error || !tripRes.data) return null;
    const nameByUserId = new Map((namesRes.data || []).map(p => [p.user_id, p.name || p.email]));
    const members = (membersRes.data || []).map(m => ({
      userId: m.user_id, role: m.role, joinedAt: m.joined_at,
      name: nameByUserId.get(m.user_id) || m.user_id,
    }));
    const auditLog = (auditRes.data || []).map(a => ({
      id: a.id, message: a.message, at: a.created_at,
      userName: nameByUserId.get(a.user_id) || 'alguém',
    }));
    return { trip: mapTrip(tripRes.data), members, auditLog };
  },

  // ---- H4.4 Papéis e permissões — o RLS já garante que só Admin promove ----
  async promoteMember(tripId, actingUserId, targetUserId, newRole) {
    const { error } = await supabaseClient
      .from('trip_members').update({ role: newRole })
      .eq('trip_id', tripId).eq('user_id', targetUserId);
    if (error) throw new Error('FORBIDDEN');
    await this.addAuditEntry(tripId, actingUserId, `promoveu um integrante a ${newRole}`);
  },

  // ---- H4.5 Histórico leve de auditoria ----
  async addAuditEntry(tripId, userId, message) {
    await supabaseClient.from('audit_log').insert({ trip_id: tripId, user_id: userId, message });
  },
};

function AuthScreen({ lang, mode, setMode, onAuthed }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');

  const [submitting, setSubmitting] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setSubmitting(true);
    try {
      const profile = mode === 'signup'
        ? await TrippinAPI.signUp({ email, password, name })
        : await TrippinAPI.logIn({ email, password });
      onAuthed(profile);
    } catch (err) {
      if (err.message === 'EMAIL_IN_USE') setError(t(lang, 'emailInUse'));
      else if (err.message === 'WRONG_CREDENTIALS') setError(t(lang, 'wrongCredentials'));
      else setError(t(lang, 'genericError'));
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="screen">
      <h2>{mode === 'signup' ? t(lang, 'createAccount') : t(lang, 'login')}</h2>
      {error && <div className="banner-error">{error}</div>}
      <form onSubmit={submit}>
        {mode === 'signup' && (
          <div className="field">
            <label>{t(lang, 'name')}</label>
            <input value={name} onChange={e => setName(e.target.value)} required />
          </div>
        )}
        <div className="field">
          <label>{t(lang, 'email')}</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'password')}</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} />
        </div>
        <button className="btn btn-primary" type="submit" disabled={submitting}>
          {mode === 'signup' ? t(lang, 'createAccount') : t(lang, 'login')}
        </button>
      </form>
      <p className="hint" style={{ textAlign: 'center', marginTop: 16, cursor: 'pointer' }}
         onClick={() => setMode(mode === 'signup' ? 'login' : 'signup')}>
        {mode === 'signup' ? t(lang, 'haveAccount') : t(lang, 'noAccount')}
      </p>
    </div>
  );

function daysUntil(dateStr) {
  const diff = new Date(dateStr + 'T00:00:00') - new Date(new Date().toDateString());
  return Math.max(0, Math.ceil(diff / 86400000));
}

function HomeScreen({ lang, user, onOpenTrip, onGoCreate, onGoJoin }) {
  const [trips, setTrips] = useState(null); // null = carregando

  useEffect(() => {
    let alive = true;
    TrippinAPI.listTripsForUser(user.id).then(list => { if (alive) setTrips(list); });
    return () => { alive = false; };
  }, [user.id]);

  if (trips === null) {
    return <div className="screen"><p className="hint">{lang === 'pt-BR' ? 'Carregando…' : 'Loading…'}</p></div>;
  }

  const now = new Date();
  const active = trips.filter(tr => new Date(tr.endDate) >= now);
  const past = trips.filter(tr => new Date(tr.endDate) < now);

  return (
    <div className="screen">
      <h2>{t(lang, 'yourTrips')}</h2>
      <div className="btn-block-row" style={{ marginBottom: 16 }}>
        <button className="btn btn-primary" onClick={onGoCreate}>{t(lang, 'createTrip')}</button>
        <button className="btn btn-secondary" onClick={onGoJoin}>{t(lang, 'joinTrip')}</button>
      </div>

      {active.length === 0
        ? <EmptyState title={t(lang, 'noTripsYet')} />
        : active.map(tr => (
            <div key={tr.id} onClick={() => onOpenTrip(tr.id)} style={{ cursor: 'pointer' }}>
              <Card>
                <h3>{tr.name}</h3>
                <p>{tr.startDate} → {tr.endDate}</p>
                <p>{t(lang, 'countdownDays', daysUntil(tr.startDate))}</p>
              </Card>
            </div>
          ))
      }

      {past.length > 0 && (
        <React.Fragment>
          <h2 style={{ marginTop: 24 }}>{t(lang, 'previousTrips')}</h2>
          {past.map(tr => (
            <div key={tr.id} onClick={() => onOpenTrip(tr.id)} style={{ cursor: 'pointer' }}>
              <Card><h3>{tr.name}</h3><p>{tr.startDate} → {tr.endDate}</p></Card>
            </div>
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

const DESTINATION_SUGGESTIONS = [
  'Lisboa, Portugal', 'Porto, Portugal', 'Roma, Itália', 'Paris, França',
  'Buenos Aires, Argentina', 'Santiago, Chile', 'Rio de Janeiro, Brasil',
  'São Paulo, Brasil', 'Nova York, EUA', 'Tóquio, Japão', 'Lima, Peru',
  'Cidade do México, México', 'Barcelona, Espanha', 'Amsterdã, Holanda',
];

function CreateTripScreen({ lang, user, onCreated, onCancel }) {
  const [name, setName] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [destInput, setDestInput] = useState('');
  const [destinations, setDestinations] = useState([]);

  const suggestions = destInput.length >= 3
    ? DESTINATION_SUGGESTIONS.filter(d => d.toLowerCase().includes(destInput.toLowerCase()))
    : [];

  function addDestination(d) {
    if (d && !destinations.includes(d)) setDestinations([...destinations, d]);
    setDestInput('');
  }

  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setSubmitting(true);
    try {
      const trip = await TrippinAPI.createTrip({ name, startDate, endDate, destinations, ownerId: user.id });
      onCreated(trip.id);
    } catch (err) {
      setError(t(lang, 'genericError'));
      setSubmitting(false);
    }
  }

  return (
    <div className="screen">
      <h2>{t(lang, 'createTrip')}</h2>
      {error && <div className="banner-error">{error}</div>}
      <form onSubmit={submit}>
        <div className="field">
          <label>{t(lang, 'tripName')}</label>
          <input value={name} onChange={e => setName(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'startDate')}</label>
          <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} required />
        </div>
        <div className="field">
          <label>{t(lang, 'endDate')}</label>
          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} required min={startDate || undefined} />
        </div>
        <div className="field">
          <label>{t(lang, 'destinations')}</label>
          <input value={destInput} onChange={e => setDestInput(e.target.value)}
                 placeholder={lang === 'pt-BR' ? 'Digite ao menos 3 letras' : 'Type at least 3 letters'} />
          {suggestions.length > 0 && (
            <div className="card" style={{ marginTop: 6 }}>
              {suggestions.map(s => (
                <div key={s} className="hint" style={{ cursor: 'pointer', padding: '4px 0' }} onClick={() => addDestination(s)}>
                  {s}
                </div>
              ))}
            </div>
          )}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 }}>
            {destinations.map(d => (
              <span key={d} className="badge badge-convidado" onClick={() => setDestinations(destinations.filter(x => x !== d))} style={{ cursor: 'pointer' }}>
                {d} ✕
              </span>
            ))}
          </div>
        </div>
        <div className="btn-block-row">
          <button className="btn btn-secondary" type="button" onClick={onCancel}>✕</button>
          <button className="btn btn-primary" type="submit" disabled={submitting}>{t(lang, 'save')}</button>
        </div>
      </form>
    </div>
  );
}

function MembersScreen({ lang, tripId, tripCode, members, auditLog, myRole, currentUserId, onChanged }) {
  const [sheetTarget, setSheetTarget] = useState(null);
  const [inviteOpen, setInviteOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const [promoting, setPromoting] = useState(false);

  async function promote(target, newRole) {
    setPromoting(true);
    try {
      await TrippinAPI.promoteMember(tripId, currentUserId, target.userId, newRole);
      setSheetTarget(null);
      onChanged();
    } finally {
      setPromoting(false);
    }
  }

  function copyCode() {
    navigator.clipboard && navigator.clipboard.writeText(tripCode).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }

  return (
    <div>
      <button className="btn btn-primary" style={{ marginBottom: 12 }} onClick={() => setInviteOpen(true)}>
        {t(lang, 'inviteMembers')}
      </button>

      {members.map(m => (
        <Card key={m.userId}>
          <div className="row-between">
            <div>
              <h3>{m.name}</h3>
              <RoleBadge role={m.role} lang={lang} />
            </div>
            {/* Convidado nunca vê ações de edição — a ação simplesmente não é renderizada (02-UXUI-spec.md §5) */}
            {myRole === 'admin' && m.role !== 'admin' && (
              <button className="btn btn-secondary" style={{ width: 'auto' }} onClick={() => setSheetTarget(m)}>
                ⋯
              </button>
            )}
          </div>
        </Card>
      ))}

      <h3 style={{ marginTop: 20 }}>{t(lang, 'auditLog')}</h3>
      {auditLog.length === 0
        ? <p className="hint">{t(lang, 'noAuditYet')}</p>
        : auditLog.map(entry => (
            <div key={entry.id} className="audit-item">
              <strong>{entry.userName}</strong> {entry.message} — {new Date(entry.at).toLocaleString(lang)}
            </div>
          ))
      }

      <BottomSheet open={!!sheetTarget} onClose={() => setSheetTarget(null)}>
        {sheetTarget && (
          <div>
            <h3>{sheetTarget.name}</h3>
            {sheetTarget.role === 'convidado' && (
              <button className="btn btn-primary" style={{ marginBottom: 8 }} disabled={promoting} onClick={() => promote(sheetTarget, 'coadmin')}>
                {t(lang, 'promoteToCoadmin')}
              </button>
            )}
            {sheetTarget.role === 'coadmin' && (
              <button className="btn btn-primary" disabled={promoting} onClick={() => promote(sheetTarget, 'admin')}>
                {t(lang, 'promoteToAdmin')}
              </button>
            )}
          </div>
        )}
      </BottomSheet>

      <BottomSheet open={inviteOpen} onClose={() => setInviteOpen(false)}>
        <h3>{t(lang, 'inviteMembers')}</h3>
        {/* Envio real de e-mail depende de Edge Function (fora da Fase A) — aqui só registramos a intenção. */}
        <div className="field">
          <label>{t(lang, 'inviteByEmail')}</label>
          <input type="email" placeholder="nome@exemplo.com" />
        </div>
        <p className="hint">{t(lang, 'inviteLinkHint')}</p>
        <div className="code-display">{tripCode}</div>
        <button className="btn btn-secondary" onClick={copyCode}>{copied ? t(lang, 'copied') : t(lang, 'copyCode')}</button>
      </BottomSheet>
    </div>
  );
}

/* =========================================================================
   App — orquestração de navegação (sem router: estado local é suficiente
   para o número de telas da Fase A)
   ========================================================================= */
function App() {
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [lang, setLang] = useState('pt-BR');
  const [authMode, setAuthMode] = useState('signup');
  const [screen, setScreen] = useState('language');
  const [tripId, setTripId] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);

  // Sessão do Supabase é restaurada automaticamente do localStorage pelo
  // próprio cliente (persistSession, padrão do supabase-js) — aqui só
  // buscamos o perfil correspondente para decidir a tela inicial.
  useEffect(() => {
    let alive = true;
    TrippinAPI.getCurrentProfile().then(profile => {
      if (!alive) return;
      if (profile) {
        setUser(profile);
        setLang(profile.language || 'pt-BR');
        setScreen(profile.onboarded ? 'home' : 'onboarding-profile');
      }
      setAuthChecked(true);
    });
    return () => { alive = false; };
  }, []);

  function handleChooseLanguage(l) { setLang(l); setScreen('auth'); }
  function handleAuthed(profile) {
    setUser(profile);
    setLang(profile.language || lang);
    setScreen(profile.onboarded ? 'home' : 'onboarding-profile');
  }
  function handleOnboarded(profile) { setUser(profile); setScreen('home'); }
  async function handleLogout() {
    await TrippinAPI.logOut();
    setUser(null);
    setScreen('language');
    setDrawerOpen(false);
  }
  async function handleChangeLanguage(l) {
    setLang(l);
    if (user) {
      const updated = await TrippinAPI.updateProfile(user.id, { language: l });
      setUser(updated);
    }
  }

  if (!authChecked) {
    return <div style={{ padding: 24, fontFamily: 'system-ui, sans-serif' }}>Carregando Trippin…</div>;
  }
  if (screen === 'language') return <LanguageScreen onChoose={handleChooseLanguage} />;
  if (screen === 'auth') return <AuthScreen lang={lang} mode={authMode} setMode={setAuthMode} onAuthed={handleAuthed} />;
  if (screen === 'onboarding-profile') return <OnboardingProfileScreen lang={lang} user={user} onDone={handleOnboarded} />;

  const tabScreen = ['home', 'create-trip', 'join-trip'].includes(screen) ? 'home'
    : screen === 'trip' ? 'trip'
    : screen === 'profile' ? 'profile'
    : 'home';

  const titles = { home: t(lang, 'appName'), trip: t(lang, 'trip'), profile: t(lang, 'profile'),
                   'create-trip': t(lang, 'createTrip'), 'join-trip': t(lang, 'joinTrip'),
                   notifications: t(lang, 'notifications'), settings: t(lang, 'settings'), privacy: t(lang, 'privacyData') };

  return (
    <div className="app-shell">
      <TopBar
        title={titles[screen] || t(lang, 'appName')}
        onMenu={() => setDrawerOpen(true)}
        onBack={['create-trip', 'join-trip', 'notifications', 'settings', 'privacy'].includes(screen) ? () => setScreen('home') : null}
      />

      {screen === 'home' && (
        <HomeScreen lang={lang} user={user}
          onOpenTrip={(id) => { setTripId(id); setScreen('trip'); }}
          onGoCreate={() => setScreen('create-trip')}
          onGoJoin={() => setScreen('join-trip')} />
      )}
      {screen === 'create-trip' && (
        <CreateTripScreen lang={lang} user={user}
          onCreated={(id) => { setTripId(id); setScreen('trip'); }}
          onCancel={() => setScreen('home')} />
      )}
      {screen === 'join-trip' && (
        <JoinTripScreen lang={lang} user={user}
          onJoined={(id) => { setTripId(id); setScreen('trip'); }}
          onCancel={() => setScreen('home')} />
      )}
      {screen === 'trip' && (
        <TripScreen lang={lang} tripId={tripId} user={user} />
      )}
      {screen === 'profile' && (
        <ProfileScreen lang={lang} user={user} onUpdate={setUser} onChangeLanguage={handleChangeLanguage} />
      )}
      {['notifications', 'settings', 'privacy'].includes(screen) && (
        <PlaceholderScreen lang={lang} title={titles[screen]} />
      )}

      <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} lang={lang} onLogout={handleLogout}
        onNavigate={(dest) => { setDrawerOpen(false); setScreen(dest); }} />

      <TabBar active={tabScreen} lang={lang} onChange={(key) => setScreen(key)} />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 24, fontFamily: 'system-ui, sans-serif' }}>
          <h2 style={{ color: '#B3413A' }}>Algo deu errado ao carregar o Trippin</h2>
          <p style={{ color: '#6B6259' }}>Recarregue a página. Se o problema persistir, avise o time.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

const rootEl = document.getElementById('root');
rootEl.dataset.mounted = 'true';
ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

<script>
  // Transformação manual via Babel.transform (em vez do scanner automático de
  // <script type="text/babel">), que em algumas versões do CDN tenta buscar presets
  // adicionais de uma URL sem versão e quebra com "Cannot use import statement
  // outside a module". Chamar Babel.transform diretamente evita esse caminho.
  var jsxSource = document.getElementById('app-source').textContent;
  var compiled = Babel.transform(jsxSource, { presets: ['react'] }).code;
  var executable = document.createElement('script');
  executable.textContent = compiled;
  document.body.appendChild(executable);
</script>
</body>
